<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0C4FA0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Espace formateur</title>
<style>
/* 30/10 : TOUJOURS en clair, quel que soit le réglage du téléphone (plus de mode sombre automatique) */
html{color-scheme:light only;background-color:var(--ds-bg)}

:root{/* Jetons --ds-* : copie EXACTE de ceux de TOPAS Formation (même palette que l'application et les mails) ; les anciens noms (--bg, --bl…) pointent dessus */
 --ds-pri:#4f46e5;--ds-pri-d:#4338ca;--ds-pri-l:#eef2ff;--ds-navy:#1e3a8a;--ds-topas:#0C4FA0;--ds-sky:#1565c0;--ds-night:#101b45;--ds-night-2:#1a2860;
 --ds-green:#15803d;--ds-green-d:#15803d;--ds-orange:#ea580c;--ds-orange-d:#c2410c;--ds-red:#dc2626;--ds-red-d:#b42318;--ds-violet:#7c3aed;--ds-pink:#db2777;--ds-amber:#d97706;
 --ds-p-blue:#eef4ff;--ds-p-green:#eafaf0;--ds-p-orange:#fff4e8;--ds-p-violet:#f3f0ff;--ds-p-pink:#fdf0f6;--ds-p-grey:#f1f5f9;--ds-p-red:#fef2f2;--ds-p-amber:#fffbeb;
 --ds-b-blue:#c7d7fb;--ds-b-green:#bfe8cf;--ds-b-orange:#fed7aa;--ds-b-red:#fecaca;--ds-b-amber:#fde68a;--ds-b-violet:#ddd6fe;--ds-on:#ffffff;
 --ds-tx:#1e293b;--ds-tx2:#334155;--ds-mu:#57606f;--ds-mu2:#5b6475;--ds-bg:#f5f7fc;--ds-card:#ffffff;--ds-line:#e5e7eb;--ds-line2:#f1f5f9;
 --ds-r-card:16px;--ds-r-tile:12px;--ds-r-btn:10px;--ds-r-pill:999px;--ds-sh:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);--ds-sh-h:0 6px 18px rgba(15,23,42,.08);
 --ip-grad:linear-gradient(125deg,var(--ds-topas),var(--ds-violet));--ip-pink-d:var(--ds-pink);--ip-pink-l:var(--ds-b-red);
 --bg:var(--ds-bg);--card:var(--ds-card);--tx:var(--ds-tx);--mu:var(--ds-mu);--br:var(--ds-line);--pr:var(--ds-navy);--bl:var(--ds-sky);--gr:var(--ds-green);--sf:var(--ds-p-blue);--ok:var(--ds-green-d);--ko:var(--ds-red-d);--or:var(--ds-orange);--gy:var(--ds-mu2)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px 14px 40px}
.sh{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(15,23,42,.06)}
.hd{display:flex;align-items:center;gap:14px;padding:14px 18px;flex-wrap:wrap}
.hd img{height:52px;background:#fff;border-radius:6px;padding:2px}
.adv{border-left:1px solid var(--br);padding-left:14px;font-size:14px;line-height:1.45}.adv b{color:var(--pr)}.adv a{color:var(--bl);overflow-wrap:anywhere}
.inst{margin:10px 0;background:var(--sf);border-radius:12px;padding:10px 12px;font-size:15px}.inst summary{cursor:pointer;font-weight:700;color:var(--pr);min-height:44px;display:flex;align-items:center}.inst p{margin:6px 0}
.band{background:var(--bl);color:#fff;text-align:center;font-size:15px;font-weight:600;padding:8px}
.bd{padding:16px 18px 18px}
.hi{font-size:26px;font-weight:800;color:var(--pr);margin:0 0 2px}
.mu{color:var(--mu);font-size:15px}
.upd{font-size:15px;color:var(--mu);margin:0}.upd b{color:var(--tx)}
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 0}
.kpi>div{background:var(--sf);border-radius:14px;padding:10px 12px;line-height:1.2}
.kpi b{display:block;font-size:26px;color:var(--pr)}.kpi span{font-size:15px;color:var(--mu)}
.hero{margin:14px 0;border-radius:18px;padding:18px;background:linear-gradient(135deg,#1e3a8a,#1565c0);color:#fff;box-shadow:0 6px 18px rgba(30,58,138,.25)}
.hero .kk{font-size:14px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;opacity:.85}
.hero h2{font-size:21px;margin:4px 0 2px;line-height:1.3;color:#fff}
.hero .cd{display:inline-block;margin:8px 0;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 14px;font-weight:800;font-size:17px}
.hero .li{font-size:15px;margin:3px 0;opacity:.95}
.hero a.btn{background:#fff;color:#1e3a8a;border-color:#fff}
.pills{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 0;margin:4px 0;background:var(--bg);scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills a{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--card);color:var(--tx);text-decoration:none;font-weight:700;font-size:15px;box-shadow:0 1px 4px rgba(15,23,42,.08)}
.pills a b{min-width:24px;height:24px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 7px;font-size:13px;color:#fff;background:var(--c,var(--bl))}
.sec{scroll-margin-top:70px}
.sec>h2{font-size:19px;margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.sec>h2 .n{font-size:14px;color:#fff;background:var(--c,var(--bl));border-radius:999px;padding:1px 10px}
.fc{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;border-left:6px solid var(--c,var(--bl));box-shadow:0 2px 10px rgba(15,23,42,.06)}
.s-auj{--c:var(--gr)}.s-cours{--c:var(--gr)}.s-venir{--c:var(--bl)}.s-clo{--c:var(--or)}.s-fini{--c:var(--gy)}
.st{display:inline-block;font-size:14px;font-weight:800;color:#fff;background:var(--c,var(--bl));border-radius:999px;padding:2px 12px;margin-right:6px}
.num{font-size:14px;color:var(--mu)}
.fc h3{font-size:19px;margin:8px 0 0;line-height:1.3;color:var(--pr)}
.cli{font-weight:700;font-size:16px}
.cdn{font-weight:800;color:var(--c,var(--bl));font-size:16px;margin-top:2px}
.ln{display:flex;gap:10px;align-items:flex-start;margin:10px 0 0;font-size:15px}
.ln>i{flex:none;font-style:normal;width:26px;text-align:center;font-size:18px;line-height:1.3}
.ln>div{flex:1;min-width:0;overflow-wrap:anywhere}
.dt{margin:4px 0;padding:8px 12px;border-left:4px solid var(--c,var(--bl));background:var(--sf);border-radius:8px}
.dt.past{opacity:.6}.dt.now{outline:2px solid var(--gr)}
.dt b{display:block;font-size:15px}.dt span{font-size:15px;color:var(--mu)}
.big{font-size:22px;font-weight:800;color:var(--tx);line-height:1.25}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
a.btn,button{font:inherit;font-size:15px;font-weight:700;border:1px solid var(--br);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.gn{background:var(--gr);border-color:var(--gr);color:#fff}
.btn.p{background:var(--pr);border-color:var(--pr);color:#fff}

.btn.on{background:var(--sf);border-color:var(--bl)}
.pan{margin-top:10px;background:var(--sf);border-radius:12px;padding:12px 14px;font-size:15px}
.pan h4{margin:0 0 6px;font-size:16px;color:var(--pr)}
.pan ul{margin:4px 0 8px 18px;padding:0}.pan li{margin:2px 0}
.dj{margin:0 0 10px}.dj>b{display:block;color:var(--pr)}
.sl{margin:4px 0 0 0}.sl>b{font-size:14px;color:var(--mu);text-transform:uppercase;letter-spacing:.3px}
details{margin-top:12px}summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;font-size:15px}
.task{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--br)}
.task:first-of-type{border-top:0}
.task>span{flex:1;min-width:180px;font-weight:600}
.task .ok{color:var(--ok);font-weight:800}
.tl{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--br);font-size:15px}.tl:first-child{border-top:0}
.tl b{flex:none;min-width:96px}
.vei{background:var(--card);border-radius:16px;padding:16px;margin:16px 0;border:2px solid #f59e0b;box-shadow:0 2px 10px rgba(15,23,42,.06)}
.vei .kk{font-size:14px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#b45309}
.vei h3{margin:4px 0;font-size:18px}
.empty{background:var(--card);border-radius:16px;padding:18px;text-align:center;color:var(--mu);font-size:16px}
.ft{margin-top:22px;text-align:center;font-size:14px;color:var(--mu)}
.pbz{margin-top:14px;border-top:1px dashed var(--br);padding-top:12px}
.pbb{width:100%;min-height:56px;justify-content:center;background:#dc2626!important;border-color:#dc2626!important;color:#fff!important;font-size:18px!important;font-weight:800!important;border-radius:12px!important}
.pbb:hover{background:#b91c1c!important}
.pbf{margin-top:10px;background:#fef2f2;border:2px solid #dc2626;border-radius:12px;padding:12px}

.pbf label{display:block;font-weight:700;margin-bottom:6px;color:#991b1b}

.pbf textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid #fca5a5;border-radius:8px;background:var(--card);color:var(--tx);resize:vertical}
.btn.dg{background:#dc2626;border-color:#dc2626;color:#fff}
.hide{display:none!important}
.pbok{margin-top:8px;padding:8px 12px;border-radius:8px;background:#e7f6ec;color:var(--ok);font-weight:600;font-size:15px}
.pberr{color:#b42318;font-weight:600;font-size:15px;margin-top:6px}
a{color:var(--bl)}
button:focus-visible,a:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
@media (max-width:480px){.hi{font-size:23px}.hd{gap:10px;padding:12px 14px}.hd img{height:44px}.adv{border:0;padding:0;flex-basis:100%}.bd{padding:14px}.kpi{gap:6px}.kpi>div{padding:8px}.kpi b{font-size:22px}.kpi span{font-size:14px}.fc{padding:14px}.btns>.btn,.btns>button{flex:1 1 calc(50% - 8px)}}
@media print{body{background:#fff;color:#000}.btns,.pills,.pbz{display:none}.fc{break-inside:avoid}}

/* espace de terrain (27/10) : listes, formation, signature */
.lh{font-size:19px;font-weight:800;list-style:none;margin:16px 0 4px}.lh::-webkit-details-marker{display:none}.lh .n{font-size:14px;color:#fff;background:var(--c,var(--bl));border-radius:999px;padding:1px 10px;margin-left:6px}.lh small{font-weight:600;color:var(--mu)}
.row{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--br);border-left:6px solid var(--c,var(--bl));border-radius:14px;padding:12px 14px;margin:8px 0;min-height:64px;font-weight:400;box-shadow:0 1px 6px rgba(15,23,42,.05)}
.row .r1{display:flex;gap:8px;align-items:center;justify-content:space-between}.row .r1 b{font-size:16px;overflow-wrap:anywhere}.row .st{margin:0;white-space:nowrap;flex:none}
.row .t{font-size:15px;color:var(--pr);margin-top:2px;font-weight:600}.row .m{font-size:14.5px;color:var(--mu);margin-top:3px}
.wt,.wt2{color:var(--or);font-weight:700}.ko{color:var(--ko);font-weight:700}.task .wt{font-weight:700}
.qb{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:10px 0;padding:10px 14px;border-radius:12px;font-size:15px}.qw{background:#fff4e5;border:2px solid var(--or);color:#7c2d12}.qk{background:#e7f6ec;color:var(--ok);border:1px solid #b7e4c7}

.sgh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 8px}.sgp{font-weight:800;color:var(--pr);font-size:17px}
.sgc{border-left-color:var(--bl)}.sgw{margin-top:10px;font-size:16px;color:var(--mu);text-align:center}.nm2{font-size:28px;font-weight:800;text-align:center;line-height:1.2;overflow-wrap:anywhere;margin:2px 0 8px}
.pad2{position:relative;width:100%;max-width:640px;margin:8px auto;aspect-ratio:320/140;background:#fff;border:2px dashed var(--bl);border-radius:14px;touch-action:none}.pad2 canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}.ph2{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:20px;pointer-events:none}
.sgb{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;margin-top:10px}.sgb .btn,.sgb button{min-height:56px;justify-content:center;font-size:17px}
.big2{width:100%;min-height:60px;justify-content:center;font-size:18px}
.btn[disabled],button[disabled]{opacity:.45;cursor:not-allowed}
@media (max-width:480px){.sgb{grid-template-columns:1fr 1fr}.sgb #val{grid-column:1/-1}.nm2{font-size:25px}}
/* interventions (BL signé sur le téléphone, 27/10) */
.secT{font-size:21px;margin:22px 0 2px;color:var(--pr)}
.fl{display:block;font-weight:700;margin:12px 0 0;font-size:16px}.fl input,.fl textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:17px;padding:10px 12px;min-height:48px;border:1px solid var(--br);border-radius:10px;background:var(--card);color:var(--tx)}
.chk{display:flex;align-items:center;gap:10px;margin:14px 0 0;min-height:48px;padding:6px 12px;border:2px solid var(--or);border-radius:12px;font-weight:800;font-size:17px;color:#9a3412;background:#fff7ed;cursor:pointer}.chk input{width:26px;height:26px;flex:none}

.pad3{max-width:none;aspect-ratio:320/140;width:calc(100% + 24px);margin:8px -12px}.sgb2{grid-template-columns:1fr 1.6fr}
.sgprev{background:#fff;border:1px solid var(--br);border-radius:12px;margin:10px 0;padding:6px}.sgprev img{display:block;width:100%;height:auto}
.blim{margin:8px 0}.blpg{display:block;width:100%;padding:0;margin:0 0 8px;border:1px solid var(--br);border-radius:10px;background:#fff;overflow:hidden;cursor:zoom-in;min-height:44px}.blpg img{display:block;width:100%;height:auto}
.zov{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.92);display:flex;flex-direction:column}.zbar{display:flex;gap:8px;align-items:center;justify-content:center;padding:8px;background:#0f172a;color:#fff;flex-wrap:wrap}.zbar button{min-height:44px;min-width:56px}.zbar span{min-width:64px;text-align:center;font-weight:700}
.zsc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom;padding:8px}.zsc img{display:block;margin:0 auto 10px;background:#fff;max-width:none}
.blch{margin-top:12px;padding:12px 14px;border:2px solid var(--or);border-radius:12px;background:#fff7ed;color:#7c2d12}.blch p{margin:4px 0 8px}.blch .btn{width:100%;justify-content:center;margin-top:8px;min-height:52px}

.rsv{flex-basis:100%;white-space:pre-wrap;background:#fff7ed;border-left:4px solid var(--or);padding:8px 10px;border-radius:8px;color:#7c2d12}
.ureg details{background:#fff7ed;border-radius:14px}.ureg .lh{color:var(--or)}.ulate{display:block;color:var(--or);font-weight:700;font-size:15px;margin-top:2px}.urow{display:flex;align-items:center;gap:10px;justify-content:space-between;min-height:64px}.urow .ul{display:flex;flex-direction:column;min-width:0;flex:1}.urow .ul b{font-size:16px;overflow-wrap:anywhere}.urow .ul b.uc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal;max-width:100%}
textarea.rmt{display:block;width:100%;box-sizing:border-box;margin:0;min-height:calc(5.8em + 22px);font:inherit;font-size:16px;line-height:1.45;padding:10px 12px;border:1px solid var(--ds-b-orange);border-radius:var(--ds-r-btn);background:var(--ds-card);color:var(--ds-tx);resize:none;overflow:hidden}
.urow .m{font-size:15px;margin-top:2px;overflow-wrap:anywhere}
.nsov{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:12px}.nsbx{background:var(--card);color:var(--tx);border-radius:18px;padding:16px;width:100%;max-width:520px;max-height:92vh;overflow:auto}.nsbx h3{margin:0 0 6px;font-size:19px}.nsr{display:grid;gap:8px;margin-top:10px}.nsrb[aria-checked="true"]{background:var(--pr);color:#fff;border-color:var(--pr)}
@supports (color:color-mix(in srgb,red,blue)){:root{--ip-pink-d:color-mix(in srgb,var(--ds-pink) 78%,var(--ds-tx));--ip-pink-l:color-mix(in srgb,var(--ds-pink) 30%,var(--ds-card))}}
/* ===== Présentation « maquette » (29/10) : jetons --ds-* de TOPAS Formation, dégradé de marque à 125°, contenu ≥ 16 px, cibles ≥ 44 px ===== */
body{background:var(--ds-bg);color:var(--ds-tx)}
body.ip-nb{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.ip-hero,.ip-hd{margin:-16px -14px 16px;background:var(--ip-grad);color:var(--ds-on);box-shadow:0 8px 22px rgba(12,79,160,.22)}
.ip-hero{padding:14px 18px 22px;border-radius:0 0 26px 26px}
.ip-hd{padding:12px 18px 20px;border-radius:0 0 22px 22px}
.ip-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ip-logo{display:flex;align-items:center;justify-content:center;width:78px;height:42px;flex:none;background:var(--ds-on);border-radius:10px;padding:4px 7px}
.ip-logo img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.ip-net{font-size:14px;font-weight:700;white-space:nowrap;padding:6px 12px;border-radius:var(--ds-r-pill);background:rgba(255,255,255,.18)}
.ip-net.off{background:rgba(15,23,42,.3)}
.ip-me{display:flex;align-items:center;gap:14px;margin-top:18px}
.ip-av{width:50px;height:50px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;letter-spacing:.02em;color:#1e293b;background:linear-gradient(135deg,var(--a),var(--b));border:2.5px solid var(--ds-on);box-shadow:0 3px 10px rgba(15,23,42,.22)}
.ip-mt{min-width:0}
.ip-hi.hi{font-size:22px;font-weight:800;line-height:1.2;margin:0;color:var(--ds-on);overflow-wrap:anywhere}
.ip-n{font-size:14px;margin-top:2px;opacity:.95}
.ip-gs{display:flex;flex-direction:column;gap:13px;margin:14px 0}
.ip-g{background:var(--gp);border:1.5px solid var(--gb);border-radius:20px;padding:2px 10px}
.ip-g>details{margin:0}.ip-g>details[open]{padding-bottom:10px}
.ip-g summary.lh{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;margin:0;padding:4px 2px 2px 4px;font-size:13px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--gt)}
.ip-g summary.lh::-webkit-details-marker{display:none}
.ip-gt{min-width:0}
.ip-g .ip-gn.n{min-width:26px;height:26px;margin:0;padding:0 7px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;background:var(--gc);color:var(--ds-on);font-size:13px;font-weight:800;letter-spacing:0;flex:none}
.ip-gx{margin:0 4px 2px;font-size:14px;color:var(--ds-mu)}
.ip-g-reg{--gc:var(--ds-orange);--gt:var(--ds-orange-d);--gp:var(--ds-p-orange);--gb:var(--ds-b-orange)}
.ip-g-auj{--gc:var(--ds-topas);--gt:var(--ds-topas);--gp:var(--ds-p-blue);--gb:var(--ds-b-blue)}
.ip-g-ven{--gc:var(--ds-violet);--gt:var(--ds-violet);--gp:var(--ds-p-violet);--gb:var(--ds-b-violet)}
.ip-g-sig{--gc:var(--ds-green);--gt:var(--ds-green-d);--gp:var(--ds-p-green);--gb:var(--ds-b-green)}
