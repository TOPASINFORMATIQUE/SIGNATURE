<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Espace formateur</title>
<style>
:root{--bg:#eef3fa;--card:#fff;--tx:#1f2937;--mu:#5a6275;--br:#d9dce5;--pr:#1e3a8a;--bl:#1565c0;--gr:#16a34a;--sf:#eef4fb;--ok:#157347;--ko:#b42318;--or:#ea580c;--gy:#94a3b8}
@media (prefers-color-scheme:dark){:root{--bg:#10131a;--card:#1a1e29;--tx:#e8eaf0;--mu:#a0a7b8;--br:#2c3242;--pr:#9db4ff;--bl:#1e4f9a;--gr:#22c55e;--sf:#1f2636;--ok:#5fd08a;--ko:#ff8a7a;--or:#fb923c;--gy:#64748b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px 14px 40px}
.sh{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(15,23,42,.06)}
.hd{display:flex;align-items:center;gap:14px;padding:14px 18px;flex-wrap:wrap}
.hd img{height:52px;background:#fff;border-radius:6px;padding:2px}
.adv{border-left:1px solid var(--br);padding-left:14px;font-size:14px;line-height:1.45}.adv b{color:var(--pr)}.adv a{color:var(--bl);overflow-wrap:anywhere}
.band{background:var(--bl);color:#fff;text-align:center;font-size:15px;font-weight:600;padding:8px}
.bd{padding:16px 18px 18px}
.hi{font-size:26px;font-weight:800;color:var(--pr);margin:0 0 2px}
.mu{color:var(--mu);font-size:15px}
.upd{font-size:15px;color:var(--mu);margin:0}.upd b{color:var(--tx)}
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 0}
.kpi>div{background:var(--sf);border-radius:14px;padding:10px 12px;line-height:1.2}
.kpi b{display:block;font-size:26px;color:var(--pr)}.kpi span{font-size:15px;color:var(--mu)}
.hero{margin:14px 0;border-radius:18px;padding:18px;background:linear-gradient(135deg,#1e3a8a,#1565c0);color:#fff;box-shadow:0 6px 18px rgba(30,58,138,.25)}
.hero .kk{font-size:14px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;opacity:.85}
.hero h2{font-size:21px;margin:4px 0 2px;line-height:1.3;color:#fff}
.hero .cd{display:inline-block;margin:8px 0;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 14px;font-weight:800;font-size:17px}
.hero .li{font-size:15px;margin:3px 0;opacity:.95}
.hero a.btn{background:#fff;color:#1e3a8a;border-color:#fff}
.pills{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 0;margin:4px 0;background:var(--bg);scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills a{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--card);color:var(--tx);text-decoration:none;font-weight:700;font-size:15px;box-shadow:0 1px 4px rgba(15,23,42,.08)}
.pills a b{min-width:24px;height:24px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 7px;font-size:13px;color:#fff;background:var(--c,var(--bl))}
.sec{scroll-margin-top:70px}
.sec>h2{font-size:19px;margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.sec>h2 .n{font-size:14px;color:#fff;background:var(--c,var(--bl));border-radius:999px;padding:1px 10px}
.fc{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;border-left:6px solid var(--c,var(--bl));box-shadow:0 2px 10px rgba(15,23,42,.06)}
.s-auj{--c:var(--gr)}.s-cours{--c:var(--gr)}.s-venir{--c:var(--bl)}.s-clo{--c:var(--or)}.s-fini{--c:var(--gy)}
.st{display:inline-block;font-size:14px;font-weight:800;color:#fff;background:var(--c,var(--bl));border-radius:999px;padding:2px 12px;margin-right:6px}
.num{font-size:14px;color:var(--mu)}
.fc h3{font-size:19px;margin:8px 0 0;line-height:1.3;color:var(--pr)}
.cli{font-weight:700;font-size:16px}
.cdn{font-weight:800;color:var(--c,var(--bl));font-size:16px;margin-top:2px}
.ln{display:flex;gap:10px;align-items:flex-start;margin:10px 0 0;font-size:15px}
.ln>i{flex:none;font-style:normal;width:26px;text-align:center;font-size:18px;line-height:1.3}
.ln>div{flex:1;min-width:0;overflow-wrap:anywhere}
.dt{margin:4px 0;padding:8px 12px;border-left:4px solid var(--c,var(--bl));background:var(--sf);border-radius:8px}
.dt.past{opacity:.6}.dt.now{outline:2px solid var(--gr)}
.dt b{display:block;font-size:15px}.dt span{font-size:15px;color:var(--mu)}
.big{font-size:22px;font-weight:800;color:var(--tx);line-height:1.25}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
a.btn,button{font:inherit;font-size:15px;font-weight:700;border:1px solid var(--br);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.gn{background:var(--gr);border-color:var(--gr);color:#fff}
.btn.p{background:var(--pr);border-color:var(--pr);color:#fff}
@media (prefers-color-scheme:dark){.btn.p{color:#0b1020}}
.btn.on{background:var(--sf);border-color:var(--bl)}
.pan{margin-top:10px;background:var(--sf);border-radius:12px;padding:12px 14px;font-size:15px}
.pan h4{margin:0 0 6px;font-size:16px;color:var(--pr)}
.pan ul{margin:4px 0 8px 18px;padding:0}.pan li{margin:2px 0}
.dj{margin:0 0 10px}.dj>b{display:block;color:var(--pr)}
.sl{margin:4px 0 0 0}.sl>b{font-size:14px;color:var(--mu);text-transform:uppercase;letter-spacing:.3px}
details{margin-top:12px}summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;font-size:15px}
.task{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--br)}
.task:first-of-type{border-top:0}
.task>span{flex:1;min-width:180px;font-weight:600}
.task .ok{color:var(--ok);font-weight:800}
.tl{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--br);font-size:15px}.tl:first-child{border-top:0}
.tl b{flex:none;min-width:96px}
.vei{background:var(--card);border-radius:16px;padding:16px;margin:16px 0;border:2px solid #f59e0b;box-shadow:0 2px 10px rgba(15,23,42,.06)}
.vei .kk{font-size:14px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#b45309}
.vei h3{margin:4px 0;font-size:18px}
.empty{background:var(--card);border-radius:16px;padding:18px;text-align:center;color:var(--mu);font-size:16px}
.ft{margin-top:22px;text-align:center;font-size:14px;color:var(--mu)}
.pbz{margin-top:14px;border-top:1px dashed var(--br);padding-top:12px}
.pbb{width:100%;min-height:56px;justify-content:center;background:#dc2626!important;border-color:#dc2626!important;color:#fff!important;font-size:18px!important;font-weight:800!important;border-radius:12px!important}
.pbb:hover{background:#b91c1c!important}
.pbf{margin-top:10px;background:#fef2f2;border:2px solid #dc2626;border-radius:12px;padding:12px}
@media (prefers-color-scheme:dark){.pbf{background:#3a1416}}
.pbf label{display:block;font-weight:700;margin-bottom:6px;color:#991b1b}
@media (prefers-color-scheme:dark){.pbf label{color:#fca5a5}}
.pbf textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid #fca5a5;border-radius:8px;background:var(--card);color:var(--tx);resize:vertical}
.btn.dg{background:#dc2626;border-color:#dc2626;color:#fff}
.hide{display:none!important}
.pbok{margin-top:8px;padding:8px 12px;border-radius:8px;background:#e7f6ec;color:var(--ok);font-weight:600;font-size:15px}
.pberr{color:#b42318;font-weight:600;font-size:15px;margin-top:6px}
a{color:var(--bl)}
button:focus-visible,a:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
@media (max-width:480px){.hi{font-size:23px}.hd{gap:10px;padding:12px 14px}.hd img{height:44px}.adv{border:0;padding:0;flex-basis:100%}.bd{padding:14px}.kpi{gap:6px}.kpi>div{padding:8px}.kpi b{font-size:22px}.kpi span{font-size:14px}.fc{padding:14px}.btns>.btn,.btns>button{flex:1 1 calc(50% - 8px)}}
@media print{body{background:#fff;color:#000}.btns,.pills,.pbz{display:none}.fc{break-inside:avoid}}
</style>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
</head>
<body>
<div class="w"><div id="app"></div></div>
<script>
const SBU="https://kbfnxqyxqualmqhiufnq.supabase.co",SBK="sb_publishable_5vjNCP7zREh5upGu_pTAIA_mgUPG8Cx";
const sbDep=(c,p)=>fetch(SBU+"/rest/v1/rpc/deposer",{method:"POST",headers:{apikey:SBK,"Content-Type":"application/json"},body:JSON.stringify({p_canal:c,p_data:p})}).then(r=>{if(!r.ok)throw 0;return 1});
const FB_MAIL="adv@topas.fr";
// Secours si le dépôt Supabase échoue : code à coller dans TOPAS Formation (« Coller un code ») + e-mail préparé que la personne envoie elle-même (aucun service tiers)
function fbHtml(code,subj,intro){const E=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),mt="mailto:"+FB_MAIL+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(intro+"\n\n"+code+"\n");
 return `<div class="fbx" role="alert"><p><b>La transmission automatique n’a pas fonctionné.</b> Rien n’a été envoyé à un autre service.</p><p>Appuyez sur « ✉ Envoyer par e-mail » : un message prêt à partir s’ouvre, adressé à ${E(FB_MAIL)}. Ou copiez le code ci-dessous et envoyez-le à ${E(FB_MAIL)}.</p><textarea readonly class="fbc" rows="3" aria-label="Code à transmettre" onclick="this.select()">${E(code)}</textarea><div class="fbb"><button type="button" class="fbbt" onclick="fbCopy(this)">📋 Copier le code</button><a class="fbbt fbgo" href="${E(mt)}">✉ Envoyer par e-mail</a></div></div>`}
function fbCopy(b){const t=b.closest(".fbx").querySelector("textarea");t.focus();t.select();let c=false;try{c=document.execCommand("copy")}catch(e){}try{if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>{b.textContent="✔ Code copié"},()=>{})}catch(e){}b.textContent=c?"✔ Code copié":"Code sélectionné : faites Ctrl+C (ou « Copier »)"}
// Lien court « ?l=identifiant » : le contenu est lu dans Supabase (table liens) ; les anciens liens « # » restent acceptés
async function lnLoad(){const id=new URLSearchParams(location.search).get("l");if(!id)return null;let j=null;
 try{const r=await fetch(SBU+"/rest/v1/rpc/lien_lire",{method:"POST",headers:{apikey:SBK,"Content-Type":"application/json"},body:JSON.stringify({p_id:id})});j=r.ok?await r.json():null}catch(e){}
 if(j&&j.ok&&j.data&&typeof j.data==="object")return j.data;throw Object.assign(new Error("lien"),{lien:j&&j.etat?j.etat:"erreur"})}
function lnDead(el,etat){const er=etat==="erreur";if(!el)return;el.innerHTML='<div id="lnko" style="max-width:640px;margin:24px auto;padding:20px;border:1px solid #d9dce6;border-radius:12px;background:#fff;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:#1e293b"><h1 style="font-size:22px;margin:0 0 10px;color:#12308f">'+(er?"Lien momentanément indisponible":"Ce lien a expiré ou n’est plus valide")+'</h1><p style="margin:0">'+(er?"Le serveur ne répond pas pour l’instant. Réessayez dans un moment, ou contactez-nous : ":"Ce lien a expiré ou n’est plus valide, contactez-nous : ")+'<a href="mailto:'+FB_MAIL+'">'+FB_MAIL+'</a>.</p></div>';document.title=er?"Lien indisponible":"Lien expiré"}

(function(){
"use strict";
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fdl=d=>{const x=new Date(d+"T12:00:00");return isNaN(x)?d:x.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})};
const fdm=d=>{const x=new Date(d+"T12:00:00");return isNaN(x)?d:x.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})};
const fds=d=>{const x=new Date(d+"T12:00:00");return isNaN(x)?d:x.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"})};
const b64u=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const PBK=n=>"fppb:"+n;const pbHist=n=>{try{return JSON.parse(localStorage.getItem(PBK(n))||"[]")}catch(e){return[]}};
function unb64u(t){t=String(t).replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";return t}
async function load(h){
 if(h.startsWith("z.")){const bin=atob(unb64u(h.slice(2))),u=Uint8Array.from(bin,c=>c.charCodeAt(0)),ds=new DecompressionStream("deflate-raw"),w=ds.writable.getWriter();w.write(u);w.close();return JSON.parse(await new Response(ds.readable).text())}
 return JSON.parse(decodeURIComponent(escape(atob(unb64u(h)))));
}
const HRS={m:["09:00","12:30","Matin · 9h00 – 12h30"],a:["14:00","17:30","Après-midi · 14h00 – 17h30"]},FULL=["09:00","17:30","Journée · 9h00 – 12h30 / 14h00 – 17h30"];
const slot=(f,d)=>HRS[(f.hf||{})[d]]||FULL;
const hOf=(f,d)=>(f.hf||{})[d]?3.5:7;
const today=()=>{const n=new Date(),p=x=>String(x).padStart(2,"0");return n.getFullYear()+"-"+p(n.getMonth()+1)+"-"+p(n.getDate())};
const T=today(),dd=(a,b)=>Math.round((Date.parse(b+"T12:00:00")-Date.parse(a+"T12:00:00"))/864e5);
const rel=d=>{const n=dd(T,d);return n===0?"aujourd’hui":n===1?"demain":n===-1?"hier":n>0?"dans "+n+" jours":"il y a "+(-n)+" jours"};
const DS=f=>[...new Set((f.ds||[]).filter(Boolean))].sort();
// statut calculé le jour de la lecture (le lien peut être ouvert plusieurs jours après l'envoi)
function stat(f){const d=DS(f),a=d[0],z=d[d.length-1];if(!a)return"venir";if(d.includes(T))return"auj";if(a>T)return"venir";if(z>=T)return"cours";return (f.cl||[]).some(x=>!x[1])?"clo":"fini"}
const SL={auj:"Aujourd’hui",cours:"En cours",venir:"À venir",clo:"À clôturer",fini:"Terminée"};
const maps=f=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(f.c+" "+(f.a||""));
function ics(f){
 const z=s=>String(s).replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n"),now=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
 const o=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//TOPAS Formation//FR","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
 DS(f).forEach(d=>{const dd2=d.replace(/-/g,""),t=slot(f,d);o.push("BEGIN:VEVENT","UID:"+f.n+"-"+dd2+"@topas-iv","DTSTAMP:"+now,"DTSTART;TZID=Europe/Paris:"+dd2+"T"+t[0].replace(":","")+"00","DTEND;TZID=Europe/Paris:"+dd2+"T"+t[1].replace(":","")+"00","SUMMARY:"+z(f.t+" – "+f.c),"LOCATION:"+z(f.a||f.c),"DESCRIPTION:"+z("N° "+f.n+"\nClient : "+f.c+"\nStagiaires : "+(f.tr||[]).map(x=>x[0]).join(", ")),"END:VEVENT")});
 o.push("END:VCALENDAR");return o.join("\r\n");
}
const HRD={m:{acc:"9h00 → 9h15",m:"9h15 → 12h15",clo:"12h15 → 12h30"},a:{acc:"14h00 → 14h15",a:"14h15 → 17h15",clo:"17h15 → 17h30"},"":{acc:"9h00 → 9h15",m:"9h15 → 12h30",a:"14h00 → 17h15",clo:"17h15 → 17h30"}};
function scDay(day,i,n){const [d,part,sls]=day,h=HRD[part||""]||HRD[""];
 return `<div class="dj"><b>Jour ${i+1}${n>1?"/"+n:""} – ${d?esc(fdl(d)):"date à définir"}${part==="m"?" (matin)":part==="a"?" (après-midi)":""}</b>${(sls||[]).map(([k,G])=>`<div class="sl"><b>${k==="m"?"Matin":"Après-midi"} · ${esc(h[k]||"")}</b>${(G||[]).map(([m,it])=>`${m?`<div><b>${esc(m)}</b></div>`:""}${(it||[]).length?`<ul>${it.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}`).join("")}</div>`).join("")}</div>`}
function scToday(f){const sc=f.sc||[];if(!sc.length)return"";const d=DS(f);let i=sc.findIndex(x=>x[0]===T);if(i<0)i=d.indexOf(T);if(i<0||!sc[i])return"";return scDay(sc[i],i,sc.length)}
function scAll(f){const sc=f.sc||[];return sc.map((x,i)=>scDay(x,i,sc.length)).join("")}
function pbZone(f,ix){return `<div class="pbz"><button type="button" class="btn pbb" data-pbo="${ix}" aria-expanded="false" aria-controls="pbf${ix}">⚠ Signalez un problème</button>
 <div class="pbf hide" id="pbf${ix}"><label for="pbt${ix}">Décrivez le problème (retard, stagiaire absent, matériel, accès aux locaux…)</label><textarea id="pbt${ix}" rows="4"></textarea>
 <div class="btns"><button type="button" class="btn dg" data-pbs="${ix}">Envoyer à TOPAS informatique</button><button type="button" class="btn" data-pbc="${ix}">Annuler</button></div><div class="pberr" id="pbe${ix}" role="alert"></div></div>
 <div id="pbh${ix}">${pbHist(f.n).map(x=>`<div class="pbok">✔ Problème envoyé le ${esc(x.tsl)} : « ${esc(x.msg.length>90?x.msg.slice(0,87)+"…":x.msg)} »</div>`).join("")}</div></div>`}
const ctLine=(f,btn)=>{const ct=f.ct||[];if(!ct[0]&&!ct[2]&&!ct[3])return"";return `<div class="ln"><i>👤</i><div><b>${esc(ct[0]||"Contact client")}</b>${ct[1]?` <span class="mu">– ${esc(ct[1])}</span>`:""}${btn?"":`${ct[2]?`<br><a href="tel:${esc(ct[2].replace(/\s/g,""))}">☎ ${esc(ct[2])}</a>`:""}${ct[3]?`<br><a href="mailto:${esc(ct[3])}">✉ ${esc(ct[3])}</a>`:""}`}${btn&&(ct[2]||ct[3])?`<div class="btns" style="margin-top:6px">${ct[2]?`<a class="btn gn" href="tel:${esc(ct[2].replace(/\s/g,""))}">📞 Appeler</a>`:""}${ct[3]?`<a class="btn" href="mailto:${esc(ct[3])}">✉ Mail</a>`:""}</div>`:""}</div></div>`};
const lieu=(f,btn)=>`<div class="ln"><i>📍</i><div><b>${esc(f.c)}</b>${f.a?`<br>${esc(f.a)}`:""}${btn?`<div class="btns" style="margin-top:6px"><a class="btn" href="${maps(f)}" target="_blank" rel="noopener">🧭 Itinéraire</a></div>`:""}</div></div>`;
const trList=f=>{const tr=f.tr||[];return tr.map(x=>esc(x[0])+(x[1]?` <span class="mu">– ${esc(x[1])}</span>`:"")).join("<br>")||"—"};
const head=(f,s,extra)=>`<div><span class="st">${esc(extra||SL[s])}</span><span class="num">N° ${esc(f.n)}</span></div><h3>${esc(f.t)}</h3><div class="cli">${esc(f.c)}</div>`;
const tg=(ix,k,lab)=>`<button type="button" class="btn" data-tg="${k}${ix}" aria-expanded="false">${lab}</button>`;
const pan=(ix,k,h)=>`<div class="pan hide" id="${k}${ix}">${h}</div>`;
// grande carte : Aujourd'hui / En cours
function bigCard(f,s,ix){const d=DS(f),i=d.indexOf(T),nx=d.find(x=>x>T),t=i>=0?slot(f,T):null,sd=scToday(f);
 const lab=s==="auj"?"Aujourd’hui · jour "+(i+1)+"/"+d.length:"En cours · prochain jour "+(nx?rel(nx):"—");
 return `<div class="fc s-${s}">${head(f,s,lab)}
 ${t?`<div class="ln"><i>🕘</i><div class="big">${esc(t[2].replace(/^.* · /,""))}</div></div>`:nx?`<div class="ln"><i>📅</i><div><b>${esc(fdl(nx))}</b><br><span class="mu">${esc(slot(f,nx)[2])}</span></div></div>`:""}
 ${lieu(f,1)}${ctLine(f,1)}
