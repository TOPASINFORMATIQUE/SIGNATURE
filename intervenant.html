<title>Espace formateur</title>
<style>
:root{--bg:#eef3fa;--card:#fff;--tx:#1f2937;--mu:#5a6275;--br:#d9dce5;--pr:#1e3a8a;--bl:#1565c0;--gr:#16a34a;--sf:#eef4fb;--ok:#157347;--ko:#b42318;--or:#ea580c;--gy:#94a3b8}
@media (prefers-color-scheme:dark){:root{--bg:#10131a;--card:#1a1e29;--tx:#e8eaf0;--mu:#a0a7b8;--br:#2c3242;--pr:#9db4ff;--bl:#1e4f9a;--gr:#22c55e;--sf:#1f2636;--ok:#5fd08a;--ko:#ff8a7a;--or:#fb923c;--gy:#64748b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px 14px 40px}
.sh{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(15,23,42,.06)}
.hd{display:flex;align-items:center;gap:14px;padding:14px 18px;flex-wrap:wrap}
.hd img{height:52px;background:#fff;border-radius:6px;padding:2px}
.adv{border-left:1px solid var(--br);padding-left:14px;font-size:14px;line-height:1.45}.adv b{color:var(--pr)}.adv a{color:var(--bl);overflow-wrap:anywhere}
.inst{margin:10px 0;background:var(--sf);border-radius:12px;padding:10px 12px;font-size:15px}.inst summary{cursor:pointer;font-weight:700;color:var(--pr);min-height:44px;display:flex;align-items:center}.inst p{margin:6px 0}
.band{background:var(--bl);color:#fff;text-align:center;font-size:15px;font-weight:600;padding:8px}
.bd{padding:16px 18px 18px}
.hi{font-size:26px;font-weight:800;color:var(--pr);margin:0 0 2px}
.mu{color:var(--mu);font-size:15px}
.upd{font-size:15px;color:var(--mu);margin:0}.upd b{color:var(--tx)}
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 0}
.kpi>div{background:var(--sf);border-radius:14px;padding:10px 12px;line-height:1.2}
.kpi b{display:block;font-size:26px;color:var(--pr)}.kpi span{font-size:15px;color:var(--mu)}
.hero{margin:14px 0;border-radius:18px;padding:18px;background:linear-gradient(135deg,#1e3a8a,#1565c0);color:#fff;box-shadow:0 6px 18px rgba(30,58,138,.25)}
.hero .kk{font-size:14px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;opacity:.85}
.hero h2{font-size:21px;margin:4px 0 2px;line-height:1.3;color:#fff}
.hero .cd{display:inline-block;margin:8px 0;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 14px;font-weight:800;font-size:17px}
.hero .li{font-size:15px;margin:3px 0;opacity:.95}
.hero a.btn{background:#fff;color:#1e3a8a;border-color:#fff}
.pills{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 0;margin:4px 0;background:var(--bg);scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills a{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--card);color:var(--tx);text-decoration:none;font-weight:700;font-size:15px;box-shadow:0 1px 4px rgba(15,23,42,.08)}
.pills a b{min-width:24px;height:24px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 7px;font-size:13px;color:#fff;background:var(--c,var(--bl))}
.sec{scroll-margin-top:70px}
.sec>h2{font-size:19px;margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.sec>h2 .n{font-size:14px;color:#fff;background:var(--c,var(--bl));border-radius:999px;padding:1px 10px}
.fc{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;border-left:6px solid var(--c,var(--bl));box-shadow:0 2px 10px rgba(15,23,42,.06)}
.s-auj{--c:var(--gr)}.s-cours{--c:var(--gr)}.s-venir{--c:var(--bl)}.s-clo{--c:var(--or)}.s-fini{--c:var(--gy)}
.st{display:inline-block;font-size:14px;font-weight:800;color:#fff;background:var(--c,var(--bl));border-radius:999px;padding:2px 12px;margin-right:6px}
.num{font-size:14px;color:var(--mu)}
.fc h3{font-size:19px;margin:8px 0 0;line-height:1.3;color:var(--pr)}
.cli{font-weight:700;font-size:16px}
.cdn{font-weight:800;color:var(--c,var(--bl));font-size:16px;margin-top:2px}
.ln{display:flex;gap:10px;align-items:flex-start;margin:10px 0 0;font-size:15px}
.ln>i{flex:none;font-style:normal;width:26px;text-align:center;font-size:18px;line-height:1.3}
.ln>div{flex:1;min-width:0;overflow-wrap:anywhere}
.dt{margin:4px 0;padding:8px 12px;border-left:4px solid var(--c,var(--bl));background:var(--sf);border-radius:8px}
.dt.past{opacity:.6}.dt.now{outline:2px solid var(--gr)}
.dt b{display:block;font-size:15px}.dt span{font-size:15px;color:var(--mu)}
.big{font-size:22px;font-weight:800;color:var(--tx);line-height:1.25}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
a.btn,button{font:inherit;font-size:15px;font-weight:700;border:1px solid var(--br);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.gn{background:var(--gr);border-color:var(--gr);color:#fff}
.btn.p{background:var(--pr);border-color:var(--pr);color:#fff}
@media (prefers-color-scheme:dark){.btn.p{color:#0b1020}}
.btn.on{background:var(--sf);border-color:var(--bl)}
.pan{margin-top:10px;background:var(--sf);border-radius:12px;padding:12px 14px;font-size:15px}
.pan h4{margin:0 0 6px;font-size:16px;color:var(--pr)}
.pan ul{margin:4px 0 8px 18px;padding:0}.pan li{margin:2px 0}
.dj{margin:0 0 10px}.dj>b{display:block;color:var(--pr)}
.sl{margin:4px 0 0 0}.sl>b{font-size:14px;color:var(--mu);text-transform:uppercase;letter-spacing:.3px}
details{margin-top:12px}summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;font-size:15px}
.task{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--br)}
.task:first-of-type{border-top:0}
.task>span{flex:1;min-width:180px;font-weight:600}
.task .ok{color:var(--ok);font-weight:800}
.tl{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--br);font-size:15px}.tl:first-child{border-top:0}
.tl b{flex:none;min-width:96px}
.vei{background:var(--card);border-radius:16px;padding:16px;margin:16px 0;border:2px solid #f59e0b;box-shadow:0 2px 10px rgba(15,23,42,.06)}
.vei .kk{font-size:14px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#b45309}
.vei h3{margin:4px 0;font-size:18px}
.empty{background:var(--card);border-radius:16px;padding:18px;text-align:center;color:var(--mu);font-size:16px}
.ft{margin-top:22px;text-align:center;font-size:14px;color:var(--mu)}
.pbz{margin-top:14px;border-top:1px dashed var(--br);padding-top:12px}
.pbb{width:100%;min-height:56px;justify-content:center;background:#dc2626!important;border-color:#dc2626!important;color:#fff!important;font-size:18px!important;font-weight:800!important;border-radius:12px!important}
.pbb:hover{background:#b91c1c!important}
.pbf{margin-top:10px;background:#fef2f2;border:2px solid #dc2626;border-radius:12px;padding:12px}
@media (prefers-color-scheme:dark){.pbf{background:#3a1416}}
.pbf label{display:block;font-weight:700;margin-bottom:6px;color:#991b1b}
@media (prefers-color-scheme:dark){.pbf label{color:#fca5a5}}
.pbf textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid #fca5a5;border-radius:8px;background:var(--card);color:var(--tx);resize:vertical}
.btn.dg{background:#dc2626;border-color:#dc2626;color:#fff}
.hide{display:none!important}
.pbok{margin-top:8px;padding:8px 12px;border-radius:8px;background:#e7f6ec;color:var(--ok);font-weight:600;font-size:15px}
.pberr{color:#b42318;font-weight:600;font-size:15px;margin-top:6px}
a{color:var(--bl)}
button:focus-visible,a:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
@media (max-width:480px){.hi{font-size:23px}.hd{gap:10px;padding:12px 14px}.hd img{height:44px}.adv{border:0;padding:0;flex-basis:100%}.bd{padding:14px}.kpi{gap:6px}.kpi>div{padding:8px}.kpi b{font-size:22px}.kpi span{font-size:14px}.fc{padding:14px}.btns>.btn,.btns>button{flex:1 1 calc(50% - 8px)}}
@media print{body{background:#fff;color:#000}.btns,.pills,.pbz{display:none}.fc{break-inside:avoid}}

/* espace de terrain (27/10) : listes, formation, signature */
.lh{font-size:19px;font-weight:800;list-style:none;margin:16px 0 4px}.lh::-webkit-details-marker{display:none}.lh .n{font-size:14px;color:#fff;background:var(--c,var(--bl));border-radius:999px;padding:1px 10px;margin-left:6px}.lh small{font-weight:600;color:var(--mu)}
.row{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--br);border-left:6px solid var(--c,var(--bl));border-radius:14px;padding:12px 14px;margin:8px 0;min-height:64px;font-weight:400;box-shadow:0 1px 6px rgba(15,23,42,.05)}
.row .r1{display:flex;gap:8px;align-items:center;justify-content:space-between}.row .r1 b{font-size:16px;overflow-wrap:anywhere}.row .st{margin:0;white-space:nowrap;flex:none}
.row .t{font-size:15px;color:var(--pr);margin-top:2px;font-weight:600}.row .m{font-size:14.5px;color:var(--mu);margin-top:3px}
.wt,.wt2{color:var(--or);font-weight:700}.ko{color:var(--ko);font-weight:700}.task .wt{font-weight:700}
.qb{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:10px 0;padding:10px 14px;border-radius:12px;font-size:15px}.qw{background:#fff4e5;border:2px solid var(--or);color:#7c2d12}.qk{background:#e7f6ec;color:var(--ok);border:1px solid #b7e4c7}
@media (prefers-color-scheme:dark){.qw{background:#3a2412;color:#fed7aa}.qk{background:#10261a}}
.sgh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 8px}.sgp{font-weight:800;color:var(--pr);font-size:17px}
.sgc{border-left-color:var(--bl)}.sgw{margin-top:10px;font-size:16px;color:var(--mu);text-align:center}.nm2{font-size:28px;font-weight:800;text-align:center;line-height:1.2;overflow-wrap:anywhere;margin:2px 0 8px}
.pad2{position:relative;width:100%;max-width:640px;margin:8px auto;aspect-ratio:320/140;background:#fff;border:2px dashed var(--bl);border-radius:14px;touch-action:none}.pad2 canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}.ph2{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:20px;pointer-events:none}
.sgb{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;margin-top:10px}.sgb .btn,.sgb button{min-height:56px;justify-content:center;font-size:17px}
.big2{width:100%;min-height:60px;justify-content:center;font-size:18px}
.btn[disabled],button[disabled]{opacity:.45;cursor:not-allowed}
@media (max-width:480px){.sgb{grid-template-columns:1fr 1fr}.sgb #val{grid-column:1/-1}.nm2{font-size:25px}}
/* interventions (BL signé sur le téléphone, 27/10) */
.secT{font-size:21px;margin:22px 0 2px;color:var(--pr)}
.fl{display:block;font-weight:700;margin:12px 0 0;font-size:16px}.fl input,.fl textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:17px;padding:10px 12px;min-height:48px;border:1px solid var(--br);border-radius:10px;background:var(--card);color:var(--tx)}
.chk{display:flex;align-items:center;gap:10px;margin:14px 0 0;min-height:48px;padding:6px 12px;border:2px solid var(--or);border-radius:12px;font-weight:800;font-size:17px;color:#9a3412;background:#fff7ed;cursor:pointer}.chk input{width:26px;height:26px;flex:none}
@media (prefers-color-scheme:dark){.chk{background:#3a2412;color:#fed7aa}}
.pad3{max-width:none;aspect-ratio:320/140;width:calc(100% + 24px);margin:8px -12px}.sgb2{grid-template-columns:1fr 1.6fr}
.sgprev{background:#fff;border:1px solid var(--br);border-radius:12px;margin:10px 0;padding:6px}.sgprev img{display:block;width:100%;height:auto}
.blim{margin:8px 0}.blpg{display:block;width:100%;padding:0;margin:0 0 8px;border:1px solid var(--br);border-radius:10px;background:#fff;overflow:hidden;cursor:zoom-in;min-height:44px}.blpg img{display:block;width:100%;height:auto}
.zov{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.92);display:flex;flex-direction:column}.zbar{display:flex;gap:8px;align-items:center;justify-content:center;padding:8px;background:#0f172a;color:#fff;flex-wrap:wrap}.zbar button{min-height:44px;min-width:56px}.zbar span{min-width:64px;text-align:center;font-weight:700}
.zsc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom;padding:8px}.zsc img{display:block;margin:0 auto 10px;background:#fff;max-width:none}
.blch{margin-top:12px;padding:12px 14px;border:2px solid var(--or);border-radius:12px;background:#fff7ed;color:#7c2d12}.blch p{margin:4px 0 8px}.blch .btn{width:100%;justify-content:center;margin-top:8px;min-height:52px}
@media (prefers-color-scheme:dark){.blch{background:#3a2412;color:#fed7aa}}
.rsv{flex-basis:100%;white-space:pre-wrap;background:#fff7ed;border-left:4px solid var(--or);padding:8px 10px;border-radius:8px;color:#7c2d12}
.ureg details{background:#fff7ed;border-radius:14px}@media (prefers-color-scheme:dark){.ureg details{background:#2a1a0e}}.ureg .lh{color:var(--or)}.ulate{display:block;color:var(--or);font-weight:700;font-size:15px;margin-top:2px}.urow{display:flex;align-items:center;gap:10px;justify-content:space-between;min-height:64px}.urow .ul{display:flex;flex-direction:column;min-width:0;flex:1}.urow .ul b{font-size:16px;overflow-wrap:anywhere}.urow .m{font-size:15px;margin-top:2px;overflow-wrap:anywhere}.utag{flex:none;border-radius:999px;padding:5px 12px;font-size:15px;font-weight:800;letter-spacing:.2px}.utag.ub{background:#fff1e6;color:#c2410c;border:1px solid #fdba74}.utag.uf{background:#e8f0fb;color:#1e4f9a;border:1px solid #93b4e0}
</style>

 const instH=()=>standalone()||LS.get("fpiv:inst",0)?"":`<details class="inst" id="inst"><summary>📲 Garder l’espace sur votre téléphone</summary><p><b>iPhone</b> : touchez « Partager » <span aria-hidden="true">⬆</span> puis « Sur l’écran d’accueil ».<br><b>Android</b> : touchez « ⋮ » puis « Installer l’application » (ou « Ajouter à l’écran d’accueil »).</p><p>L’icône « TOPAS Intervenants » s’ouvre en plein écran, toujours à jour, et même sans réseau.</p><button type="button" class="btn" data-insok>C’est fait</button></details>`;

 // chaque ligne : le client, la date et l'heure, le lieu ; à droite l'étiquette « BL » (orange) ou « Formation » (bleu). Le détail au clic est inchangé.
 const uHr=t=>String(t||"").replace(/^[^·]*·\s*/,"");
 const uF=(x,d,late)=>{const f=x.f,dd=DS(f),dt=d||dd[0]||"";return {k:dt+" "+((HRS[(f.hf||{})[dt]]||FULL)[0]),h:`<button type="button" class="row urow" data-f="${x.ix}" style="--c:var(--bl)"><span class="ul"><b>${esc(f.c||"")}</b><span class="m">${dt?esc(fds(dt))+(dd.length>1?" <small>("+dd.length+" j)</small>":"")+" · "+esc(uHr(slot(f,dt)[2])):"Dates à définir"}</span>${late&&dt?uAgo(dt)+`<span class="m">✍ ${pastDue(f).length} émargement${pastDue(f).length>1?"s":""} à faire signer</span>`:""}<span class="m">${esc(f.a||city(f)||"")}</span></span><span class="utag uf">Formation</span></button>`}};
 // retard : « il y a N jours » (bon ou émargement daté d'avant aujourd'hui, pas signé)
 const uAgo=d=>{const n=Math.round((Date.parse(T)-Date.parse(d))/864e5);return n>0?`<span class="ulate">⏰ il y a ${n} jour${n>1?"s":""}</span>`:""};
 const pastDue=f=>SLOTS(f).filter(sl=>sl.day<T&&!emState(f,sl)).map(sl=>sl.day).sort();
 const uB=(x,late)=>{const t=x.t;return {k:(t.d||"9999-12-31")+" "+(t.h||"00:00"),h:`<button type="button" class="row urow" data-it="${x.ix}" data-b="${esc(t.b||"")}" style="--c:var(--or)"><span class="ul"><b>${esc(t.c||t.nm||"Intervention")}</b><span class="m">${t.d?esc(fds(t.d))+(t.h?" · "+esc(t.h):""):"Date à préciser"}</span>${late&&t.d?uAgo(t.d):""}<span class="m">${esc(t.a||itCity(t)||"")}</span></span><span class="utag ub">BL</span></button>`}};
 // ⏰ À régulariser : tout ce qui est daté d'avant aujourd'hui et pas signé (bons de livraison + émargements), en tête, le plus ancien d'abord
 function uGroups(){const G3=itGroups(),inF=x=>shF?x:[],last=x=>DS(x.f).slice(-1)[0]||"",nxt=x=>DS(x.f).find(d=>d>=T)||DS(x.f)[0]||"",up=(a,b)=>a.k.localeCompare(b.k),dn=(a,b)=>b.k.localeCompare(a.k);
  const lateF=x=>pastDue(x.f).length>0&&!(x.f.cl||[]).some(z=>z[0]==="emarg"&&z[1]),regF=inF(F.filter(lateF)),regB=G3.auj.filter(x=>x.t.d&&x.t.d<T);
  return {reg:regF.map(x=>uF(x,pastDue(x.f)[0],1)).concat(regB.map(x=>uB(x,1))).sort(up),
   auj:inF(encours).filter(x=>!lateF(x)||DS(x.f).includes(T)).map(x=>uF(x,DS(x.f).includes(T)?T:x.s==="clo"?last(x):nxt(x))).concat(G3.auj.filter(x=>!regB.includes(x)).map(x=>uB(x))).sort(up),
   ven:inF(venir).map(x=>uF(x,nxt(x))).concat(G3.ven.map(x=>uB(x))).sort(up),
   sig:inF(passees).filter(x=>!lateF(x)).map(x=>uF(x,last(x))).concat(G3.sig.filter(x=>!x.t.d||x.t.d>=lim12).map(x=>uB(x))).sort(dn)}}
 function uList(){const U=uGroups(),S3=(t,c,arr,open,empty,k)=>`<section class="sec" id="s-${k}" style="--c:${c}"><details ${open?"open":""}><summary class="lh">${t} <span class="n">${arr.length}</span></summary>${arr.map(o=>o.h).join("")||`<div class="empty">${empty}</div>`}</details></section>`;
  return (U.reg.length?S3("⏰ À régulariser","var(--or)",U.reg,true,"","ureg").replace('class="sec"','class="sec ureg"'):"")+S3("▶ Aujourd’hui","var(--gr)",U.auj,true,"Rien de prévu aujourd’hui.","uauj")+S3("🔜 À venir","var(--bl)",U.ven,true,"Rien de prévu pour le moment.","uven")+S3("✅ Signées <small>(12 derniers mois)</small>","var(--gy)",U.sig,false,"Rien de signé pour l’instant.","usig")}
 function listView(){const V2=D.v;
  const L=(t,c,arr,open,empty,k)=>`<section class="sec" id="s-${k}" style="--c:${c}"><details ${open?"open":""}><summary class="lh">${t} <span class="n">${arr.length}</span></summary>${arr.map(row).join("")||`<div class="empty">${empty}</div>`}</details></section>`;
  const LI=(t,c,arr,open,empty,k)=>`<section class="sec" id="s-${k}" style="--c:${c}"><details ${open?"open":""}><summary class="lh">${t} <span class="n">${arr.length}</span></summary>${arr.map(itRow).join("")||`<div class="empty">${empty}</div>`}</details></section>`,G3=itGroups();
  return top()+`<div class="bd"><div class="hi">Bonjour${pr?" "+esc(pr):""} 👋</div><p class="upd">Mis à jour le <b>${esc(fds(D.u||T))}</b>. ${EJ?"Votre espace se met à jour tout seul : gardez ce lien (ou l’icône sur votre écran d’accueil).":"Si le planning change, un nouveau lien vous est envoyé : utilisez toujours le plus récent."}</p>${EJ?instH():""}
  ${shF?`<div class="kpi"><div><b>${nUp}</b><span>À venir</span></div><div><b>${nMo}</b><span>Ce mois-ci <small>(jour${nMo>1?"s":""})</small></span></div><div><b>${String(hUp).replace(".",",")} h</b><span>Heures planifiées</span></div></div>`:`<div class="kpi"><div><b>${G3.auj.filter(x=>x.t.d===T).length}</b><span>Aujourd’hui</span></div><div><b>${G3.ven.length}</b><span>À venir</span></div><div><b>${G3.sig.length}</b><span>Signées</span></div></div>`}</div></div>
  <div id="qbn">${bannerHtml()}</div>${horsH()}
  ${shF&&nx?`<div class="hero"><div class="kk">Prochaine intervention</div><h2>${esc(nx.x.f.t)}</h2><div class="li"><b>${esc(nx.x.f.c)}</b></div><div class="cd">${esc(rel(nx.d).replace(/^./,c=>c.toUpperCase()))}</div><div class="li">📅 ${esc(fdl(nx.d))}${DS(nx.x.f).length>1?` <span style="opacity:.8">(${DS(nx.x.f).map(fdm).join(", ")})</span>`:""}</div><div class="li">🕘 ${esc(slot(nx.x.f,nx.d)[2])}</div><div class="li">📍 ${esc(nx.x.f.c)}${nx.x.f.a?" – "+esc(nx.x.f.a):""}</div><div class="btns"><a class="btn" href="${maps(nx.x.f)}" target="_blank" rel="noopener">🧭 Itinéraire</a></div></div>`:""}
  ${uList()}

  ${foot()}`}

 // ---- interventions : état (signé dans l'application, ou sur ce téléphone), regroupement, ligne, fiche
 // ---- le bon de livraison EN IMAGES (pages rendues par TOPAS Formation), gardé dans le téléphone pour fonctionner hors connexion
 const IDB={d:null,open(){if(!this.d)this.d=new Promise(res=>{try{const r=indexedDB.open("fpiv",1);r.onupgradeneeded=()=>{try{r.result.createObjectStore("img")}catch(e){}};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});return this.d},
  async get(k){const d=await this.open();if(!d)return null;return new Promise(res=>{try{const q=d.transaction("img").objectStore("img").get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})},
  async put(k,v){const d=await this.open();if(!d)return false;return new Promise(res=>{try{const x=d.transaction("img","readwrite");x.objectStore("img").put(v,k);x.oncomplete=()=>res(true);x.onerror=()=>res(false)}catch(e){res(false)}})}};
 const IMG={};
 async function blImg(t){if(!t||!t.pf)return null;if(IMG[t.pf])return IMG[t.pf];const c=await IDB.get(t.pf);if(Array.isArray(c)&&c.length)return IMG[t.pf]=c;
  try{let P=null;if(t.pf.startsWith("e:")){const r=await fetch(SBU+"/rest/v1/rpc/espace_doc",{method:"POST",headers:{apikey:SBK,"Content-Type":"application/json"},body:JSON.stringify({p_jeton:EJ,p_itv:t.i})}),j=r.ok?await r.json():null;let a=null;try{a=j&&j.ok?JSON.parse(j.b64):null}catch(e){}P=Array.isArray(a)?a.filter(x=>typeof x==="string"&&x.length>100):null}
   else{const r=await fetch(SBU+"/rest/v1/rpc/lien_lire",{method:"POST",headers:{apikey:SBK,"Content-Type":"application/json"},body:JSON.stringify({p_id:t.pf})}),j=r.ok?await r.json():null;P=j&&j.ok&&j.data&&Array.isArray(j.data.p)?j.data.p.filter(x=>typeof x==="string"&&x.length>100):null}
   if(P&&P.length){IMG[t.pf]=P;await IDB.put(t.pf,P);return P}}catch(e){}return null}
 const imgBox=ix=>`<div class="blim" data-blim="${ix}"><p class="mu">⏳ Chargement du bon de livraison…</p></div>`;
 async function fillImgs(){for(const el of document.querySelectorAll("[data-blim]")){const ix=+el.dataset.blim,x=IT[ix];if(!x)continue;const P=await blImg(x.t);if(!document.body.contains(el))continue;
  el.innerHTML=P?P.map((b,i)=>`<button type="button" class="blpg" data-zoom="${ix}:${i}" aria-label="Agrandir la page ${i+1} du bon"><img alt="Bon de livraison ${esc(x.t.nm||x.t.b||"")}, page ${i+1}" src="data:image/jpeg;base64,${b}"></button>`).join("")+'<p class="mu" style="margin:0">🔍 Touchez le bon pour l’agrandir (zoom avec deux doigts).</p>'
   :`<div class="qb qw" role="status"><b>⚠ Le bon de livraison n’est pas disponible sur ce téléphone</b><span>${x.t.pf?"Il n’a pas encore pu être téléchargé (pas de connexion ?).":(EJ?"TOPAS informatique ne l’a pas encore transmis : il apparaîtra ici tout seul dès qu’il le sera.":"TOPAS informatique ne l’a pas encore transmis : demandez un nouvel envoi de votre espace.")}</span>${x.t.pf?'<button type="button" class="btn" data-blretry>🔄 Réessayer</button>':""}</div>`;
  el.querySelectorAll("[data-zoom]").forEach(b=>b.onclick=()=>{const [i,k]=b.dataset.zoom.split(":").map(Number);zoom(IMG[IT[i].t.pf]||[],k)});const rt=el.querySelector("[data-blretry]");if(rt)rt.onclick=()=>{el.innerHTML='<p class="mu">⏳ Nouvel essai…</p>';fillImgs()}}}
 function zoom(P,k){let z=100;const o=document.createElement("div");o.className="zov";o.setAttribute("role","dialog");o.setAttribute("aria-label","Bon de livraison agrandi");
  o.innerHTML=`<div class="zbar"><button type="button" class="btn" data-zm="-1" aria-label="Réduire">－</button><span>100 %</span><button type="button" class="btn" data-zm="1" aria-label="Agrandir">＋</button><button type="button" class="btn p" data-zx>✕ Fermer</button></div><div class="zsc">${P.map(b=>`<img alt="Bon de livraison" src="data:image/jpeg;base64,${b}" style="width:100%">`).join("")}</div>`;
  const set=()=>{o.querySelectorAll(".zsc img").forEach(i=>i.style.width=z+"%");o.querySelector(".zbar span").textContent=z+" %"};o.querySelectorAll("[data-zm]").forEach(b=>b.onclick=()=>{z=Math.max(100,Math.min(400,z+100*+b.dataset.zm));set()});o.querySelector("[data-zx]").onclick=()=>o.remove();document.body.appendChild(o);const im=o.querySelectorAll(".zsc img")[k];if(im)im.scrollIntoView()}
 // préchargement des bons encore à signer dès qu'il y a du réseau
 async function prefetch(){for(const x of IT){if(x.t.pf&&!IMG[x.t.pf]&&blSt(x).k==="faire")try{await blImg(x.t)}catch(e){}}}
 const repRec=i=>recs("blrep:"+i).sort((a,b)=>String(b.dl+b.hl).localeCompare(String(a.dl+a.hl)))[0];
 const blRec=i=>recs("bl:"+i).sort((a,b)=>b.v-a.v)[0];
 const blSt=x=>{const r=blRec(x.t.i),sd=x.t.sd||"";if(r){const pd=!!pend(r.id);return{k:pd?"att":"sig",r,txt:(pd?"⏳ Signé le ":"✔ Signé le ")+dm(r.dl)+" à "+r.hl+(pd?" · en attente d’envoi":" · transmis")}}if(x.t.s)return{k:"sig",txt:"✔ Signé"+(sd?" le "+dm(sd.slice(0,10))+(sd.length>10?" à "+sd.slice(11):""):"")};return{k:"faire"}};
 function itGroups(){const fa=IT.filter(x=>blSt(x).k==="faire"),by=(a,b)=>String(a.t.d||"9999").localeCompare(String(b.t.d||"9999"));return{auj:fa.filter(x=>x.t.d&&x.t.d<=T).sort(by),ven:fa.filter(x=>!x.t.d||x.t.d>T).sort(by),sig:IT.filter(x=>blSt(x).k!=="faire").sort((a,b)=>by(b,a))}}
 const itMaps=t=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent((t.c||"")+" "+(t.a||""));
 const itCity=t=>{const a=String(t.a||"").split(",").pop().trim();return a||t.c||""};
 const itRow=x=>{const t=x.t,s=blSt(x),late=s.k==="faire"&&t.d&&t.d<T;return `<button type="button" class="row" data-it="${x.ix}" style="--c:${s.k!=="faire"?"var(--gy)":t.d&&t.d<=T?"var(--gr)":"var(--bl)"}"><div class="r1"><b>${esc(t.c||t.nm||"Intervention")}</b><span class="st">${s.k==="att"?"À transmettre":s.k==="sig"?"Signé":t.d===T?"Aujourd’hui":late?"À faire signer":"À venir"}</span></div><div class="t">🚚 ${esc(t.nm||("BL N° "+(t.b||"—")))}</div><div class="m">📅 ${t.d?esc(fds(t.d))+(t.h?" · "+esc(t.h):""):"date à préciser"} · 📍 ${esc(itCity(t))}${s.k!=="faire"?" · "+esc(s.txt):""}</div></button>`};
 function itView(ix){const x=IT[ix];if(!x)return listView();const t=x.t,s=blSt(x);
  return top()+`<div class="bd"><button type="button" class="btn" data-back>← Mon espace</button></div></div>
  <div id="qbn">${bannerHtml()}</div>
  <div class="fc s-${s.k==="faire"?(t.d&&t.d<=T?"auj":"venir"):"fini"}"><div><span class="st">${s.k==="faire"?(t.d===T?"Aujourd’hui":t.d&&t.d<T?"À faire signer":"À venir"):"Signé"}</span><span class="num">${esc(t.nm||("BL N° "+(t.b||"—")))}</span></div><h3>${esc(t.c||t.nm||"Intervention")}</h3>
   <div class="ln"><i>📍</i><div><b>Adresse d’intervention</b><br>${t.a?esc(t.a):'<span class="mu">non précisée</span>'}<div class="btns" style="margin-top:6px"><a class="btn" href="${itMaps(t)}" target="_blank" rel="noopener">🧭 Itinéraire</a></div></div></div>
   <div class="ln"><i>📅</i><div><b>${t.d?esc(fdl(t.d)):"Date à préciser"}</b>${t.h?` · ${esc(t.h)}`:""}</div></div>
   <div class="ln"><i>☎</i><div><b>TOPAS informatique</b>${D.m?`<br><a href="mailto:${esc(D.m)}">✉ ${esc(D.m)}</a>`:""}${G[1]?`<br><a href="tel:${esc(G[1].replace(/\s/g,""))}">☎ ${esc(G[1])}</a>`:""}</div></div></div>
  ${s.k==="faire"?`${(r=>r?`<div class="qb ${pend(r.id)?"qw":"qk"}" role="status"><b>⏸ Signature reportée le ${esc(dm(r.dl))} à ${esc(r.hl)}</b><span>${pend(r.id)?"en attente d’envoi":"TOPAS informatique est prévenu"}</span></div>`:"")(repRec(t.i))}<div class="btns"><button type="button" class="btn gn big2" data-bls="${ix}">✍ Faire signer le client</button></div><div id="blch"></div>`:`<div class="qb ${s.k==="att"?"qw":"qk"}" role="status"><b>${esc(s.txt)}</b>${s.r&&s.r.res?'<span class="ko">avec remarque</span>':""}</div>`}
  <section class="sec" style="--c:var(--bl)"><h2>📄 Le bon de livraison</h2><div class="fc s-venir">${imgBox(ix)}</div></section>
  ${s.k==="faire"?blForm(ix):""}
  ${foot()}`}
 // ---- signature du BL : ce que le client signe (au-dessus), nom, fonction, réserves, tracé ; vérification ; rien n'est envoyé avant « Terminer »
 let BS=null;
 const sgPts=sg=>String(sg||"").split(";").map(st=>st.split(",").map(q=>q.split(".").map(v=>parseInt(v,36))).filter(q=>q.length===2&&!isNaN(q[0])&&!isNaN(q[1]))).filter(x=>x.length);
 const svgOf=st=>"data:image/svg+xml;charset=utf-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140"><path d="'+st.map(s=>"M"+s.map(q=>q[0]+" "+q[1]).join(" L")).join(" ")+'" fill="none" stroke="#12308f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>');
 const blWhat=(t,ix,noimg)=>`<div class="pan"><h4>Ce que vous signez</h4><div><b>${esc(t.nm||("Bon de livraison N° "+(t.b||"—")))}</b>${t.c?" · "+esc(t.c):""}</div><div>Intervention du ${t.d?esc(fdl(t.d)):"(date à préciser)"}</div>${noimg?'<div class="qb qw" style="margin:8px 0 0"><b>⚠ Le bon n’a pas pu être affiché</b><span>Le client signe sans le voir : ce sera noté sur le bon signé.</span></div>':imgBox(ix)}</div>`;
 // encart « Signature électronique » DANS la fiche, sous le bon : prénom, nom, fonction, réserves, signature composée ou au doigt

  <label class="fl" for="blpr">Prénom du signataire *</label><input class="fl" id="blpr" autocomplete="given-name" value="${esc(BS.pr)}" style="font-weight:400">

 function blStart(ix,noimg){if(!BS||BS.ix!==ix)BS=blNew(ix);if(noimg)BS.noimg=1;BS.open=1;BS.step="form";if(V.v!=="it"||V.ix!==ix)nav({v:"it",ix});else view();setTimeout(()=>{const e=document.getElementById("blsig");if(e)e.scrollIntoView({behavior:"smooth",block:"start"})},60)}
 // bon indisponible : choix explicite, tracé dans l'intervention (signer quand même / reporter)
 function blChoice(ix){const el=document.getElementById("blch");if(!el)return;el.innerHTML=`<div class="blch" role="alert"><b>⚠ Le bon de livraison n’est pas disponible sur ce téléphone.</b><p>Le client ne peut pas voir ce qu’il signe. Choisissez :</p>
