<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Signature en ligne</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#14171f;--mu:#5a6275;--br:#d9dce5;--pr:#12308f;--ok:#157347;--ko:#b42318;--ac:#7a1010}
@media (prefers-color-scheme:dark){:root{--bg:#10131a;--card:#1a1e29;--tx:#e8eaf0;--mu:#a0a7b8;--br:#2c3242;--pr:#8fa8ff;--ok:#5fd08a;--ko:#ff8a7a;--ac:#ff9b9b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:6px 0 2px;color:var(--pr)}
h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:16px;margin:12px 0}
.mu{color:var(--mu);font-size:14px}
.row{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:4px 0}
.row b{color:var(--mu);font-weight:600}
@media(max-width:560px){.row{grid-template-columns:1fr;gap:0}.row b{margin-top:6px}}
.art{display:inline-block;background:#ececf2;color:var(--ac);font-weight:700;border-radius:999px;padding:2px 12px;margin:14px 0 6px;font-size:14px}
@media (prefers-color-scheme:dark){.art{background:#262c3c}}
table{width:100%;border-collapse:collapse;margin:6px 0}
td,th{padding:6px 8px;border-bottom:1px solid var(--br);text-align:left;font-size:15px}
td.r{text-align:right;white-space:nowrap}
.dt{margin:6px 0;padding:8px 12px;border-left:4px solid var(--pr);background:rgba(18,48,143,.07);border-radius:6px}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=text]{width:100%;font:inherit;padding:12px;border:1px solid var(--br);border-radius:8px;background:var(--card);color:var(--tx)}
input[type=text]:focus,button:focus-visible,canvas:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
.pad{position:relative;border:2px dashed var(--br);border-radius:10px;background:#fff;aspect-ratio:320/140;width:100%;touch-action:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.pad .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa0b0;pointer-events:none;font-size:15px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-weight:600}
.chk input{width:24px;height:24px;margin-top:2px;flex:none}
button,a.btn{display:inline-block;font:inherit;font-weight:700;border:0;border-radius:10px;padding:14px 20px;cursor:pointer;text-decoration:none;text-align:center}
.go{background:var(--pr);color:#fff;width:100%;font-size:18px}
@media (prefers-color-scheme:dark){.go{color:#0b1020}}
.go[disabled]{opacity:.5;cursor:not-allowed}
.sec{background:transparent;border:1px solid var(--br);color:var(--tx);padding:8px 14px;font-weight:600;font-size:14px}
.err{color:var(--ko);font-weight:600;min-height:1.4em}
.okb{border-color:var(--ok)}
.okt{color:var(--ok);font-weight:700;font-size:18px}
.hide{display:none}
@media print{body{background:#fff;color:#000}.noprint{display:none!important}.card{border:0;padding:0}}

.paper{background:#fff;color:#111;border:1px solid var(--br);border-radius:6px;padding:22px 22px;margin:12px 0;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.cv{font:12.5px/1.4 Arial,Helvetica,sans-serif;color:#111}.cv *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cv .hg{display:grid;grid-template-columns:44% 56%;gap:10px;align-items:stretch}.cv .hg .gb{display:flex;flex-direction:column;justify-content:center}.cv .cf{text-align:center;align-items:center}.cv .cl{text-align:left;align-items:flex-start}
.cv .lg{border-left:12px solid #12308f;padding-left:8px}.cv .lg img{height:62px;display:block}.cv .ad{font-size:11.5px;line-height:1.55;margin-top:4px}.cv .web{color:#12308f}
.cv .gb{background:#ececec;border-radius:10px;padding:8px 12px}.cv .ttl{background:#e4e4ea;border-radius:8px;color:#12308f;font-weight:700;font-size:20px;text-align:center;padding:10px 6px}
.cv .mr{color:#7a1010;font-weight:700}.cv .mr2{color:#7a1010}.cv .pill{background:#ececec;border-radius:10px;padding:3px 10px;color:#7a1010;font-weight:700;display:inline-block;min-width:150px}
.cv .art{display:flex;gap:10px;align-items:center;margin:14px 0 6px;flex-wrap:wrap}.cv .r{display:grid;grid-template-columns:170px 1fr;gap:8px;margin:3px 0}.cv .r b{text-align:right;color:#111;font-weight:700}
.cv .trg{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
.cv .ft{margin-top:12px;font-size:10.5px;color:#12308f;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cv table{border-collapse:collapse}.cv td,.cv th{padding:2px 12px;text-align:center;border:0}
.cv .sg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}.cv .sg>div{background:#ececec;border-radius:8px;min-height:105px;text-align:center;padding:6px}.cv .sg img{max-width:100%;max-height:80px}
.cv .px{width:100%;margin:8px 0 4px}.cv .px td{padding:6px 10px;text-align:center;font-size:13px;border-bottom:1px solid #d8d8d8}.cv .px .hd td{font-size:11px;color:#7a1010;font-weight:700;text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid #7a1010}.cv .px .lb{text-align:right;font-weight:700}
.cv .tt{width:100%;border-collapse:separate;background:#ececec;border-radius:10px;margin-top:10px}.cv .tt .sl{width:42%;padding:14px 22px;color:#7a1010;font-weight:700;font-size:15px;text-align:left}.cv .tt .am{text-align:right}.cv .tt .am table{margin:8px 20px 8px auto;width:auto}.cv .tt .am td{padding:3px 10px;font-weight:700;text-align:left;font-size:14px}.cv .tt .am .v{text-align:right;min-width:120px}.cv .tt .tc td{border-top:1px solid #888;padding-top:5px}
.pln{font-size:13px;line-height:1.5}.pln .hg2{display:grid;grid-template-columns:40% 60%;gap:12px;align-items:start}.pln .ttp{background:#e4e4ea;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-radius:6px;gap:8px;flex-wrap:wrap}.pln .ttp b{font-size:24px;color:#12308f}
.pln .bar{background:#e4e4ea;color:#7a1010;font-weight:700;font-size:15px;padding:8px 14px;border-radius:6px;margin-bottom:6px}.pln .bx{border:1px solid #666;border-radius:4px;padding:8px 10px;min-height:92px}.pln .g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}.pln .msg{margin:18px 0 14px}.pln .rd{color:#7a1010;font-weight:700}
.pln .rw{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.pln .box{background:#f6f6f8;border-radius:6px;padding:10px 14px;min-height:150px}.pln .dtp{margin:5px 0;padding:5px 8px;background:#fff;border-left:4px solid #12308f;border-radius:4px}.pln .ftp{margin-top:24px;text-align:center;font-size:15px;border-bottom:6px solid #12308f;padding-bottom:10px}
@media(max-width:640px){.paper{padding:12px}.cv .hg,.pln .hg2,.pln .g2,.pln .rw,.cv .sg,.cv .trg{grid-template-columns:1fr}.cv .r{grid-template-columns:1fr;gap:0}.cv .r b{text-align:left;margin-top:6px}.cv .ttl{font-size:17px}.cv .tt .sl{display:block;width:auto;padding:10px 14px}.cv .tt,.cv .tt>tbody,.cv .tt>tbody>tr,.cv .tt>tbody>tr>td{display:block;width:100%}.cv .tt .am table{margin:4px 10px 8px auto}.cv .px td{padding:6px 3px;font-size:12px}}
@media print{.paper{border:0;box-shadow:none;padding:0}}
.pdx{margin-top:22px;break-before:page;page-break-before:always}.pdj{border:1px solid #c9cde0;border-radius:6px;margin:8px 0;overflow:hidden}.pdh{background:#12308f;color:#fff;font-weight:700;padding:6px 10px}.pdb{padding:4px 10px 2px;break-inside:avoid}.pdt{font-weight:700;color:#12308f;margin-top:4px}.pdm{font-weight:600;margin-top:3px}.pdb ul{margin:2px 0 4px 18px;padding:0}
</style>
</head>

<div class="w">
<div id="app"></div>
</div>
<script>
const SBU="https://kbfnxqyxqualmqhiufnq.supabase.co",SBK="sb_publishable_5vjNCP7zREh5upGu_pTAIA_mgUPG8Cx";
const sbDep=(c,p)=>fetch(SBU+"/rest/v1/rpc/deposer",{method:"POST",headers:{apikey:SBK,"Content-Type":"application/json"},body:JSON.stringify({p_canal:c,p_data:p})}).then(r=>{if(!r.ok)throw 0;return 1});

(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>Number(n||0).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=d=>{if(!d)return"—";const x=new Date(d+"T12:00:00");return isNaN(x)?d:x.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"})};
const fdl=d=>{const x=new Date(d+"T12:00:00");return isNaN(x)?d:x.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})};
const b64u=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
function unb64u(t){t=String(t).replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";return JSON.parse(decodeURIComponent(escape(atob(t))))}
let D=null;
try{D=unb64u(location.hash.replace(/^#/,""))}catch(e){D=null}
const app=$("#app");
if(!D||!D.n||!D.g){app.innerHTML='<div class="card"><h1>Lien incomplet</h1><p>Ce lien de signature est incomplet ou a été modifié. Merci de rouvrir le lien reçu par e-mail, tel quel, ou de contacter l’organisme de formation.</p></div>';return}
const plan=D.k==="plan",G=D.g,C=D.c||["","",""],tr=D.tr||[];
const org=G[0]||"",addr=G[1]||"",tel=G[2]||"",mail=G[3]||"",web=G[4]||"",nda=G[5]||"",siret=G[6]||"";
document.title=(plan?"Validation de la planification":"Signature de la convention")+" "+D.n;
const KEY="fpsig:"+D.k+":"+D.n;
let done=null;try{done=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}

const frd=d=>{if(!d)return"—";const x=d.split("-");return (+x[2])+"/"+(+x[1])+"/"+x[0].slice(2)};
const fjn=n=>String(n).replace(".",",");
const nmT=i=>esc(tr[i]||"")+((D.tf||[])[i]?" "+esc(D.tf[i]):"");
function sigBlock(){return done&&done.sg?`<br>${sigSvg(done.sg)}<div style="font-size:10px;color:#333">Signé électroniquement par ${esc(done.nm)}<br>le ${esc(done.tsl)}</div>`:""}
function docConv(){
 const nbj=D.j||1,h=+D.h||nbj*7,pj=+D.pj||0,tot=pj*nbj,tva=tot*.2,hj=h/nbj||7,dcf=fd(D.dc);
 const row=(l,v)=>`<div class="r"><b>${l}</b><span>${v}</span></div>`;
 return `<div class="cv"><div class="hg">
<div class="lg"><img src="logo.jpg" alt="TOPAS informatique"><div class="ad"><span class="mr">Entre</span><br>${esc(addr)}<br>Tél ${esc(tel)}<br>Mail ${esc(mail)}<br><b class="web">${esc(web)}</b></div></div>
<div><div class="ttl">Convention simplifiée de Formation professionnelle</div><div style="margin:12px 0 0"><b>N°</b> &nbsp; <span style="font-size:15px">${esc(D.n)}</span> &nbsp;&nbsp;&nbsp; <b>Date</b> &nbsp; ${esc(dcf)}</div></div>
<div class="gb cf"><b>Centre de Formation</b><div style="margin-top:8px"><b>N° Agrément : ${esc(nda)}</b><br><small>inscrit auprès de la Préfecture<br>de la Région Rhône Alpes</small></div><div style="margin-top:8px;font-size:11px;line-height:1.6"><b>URSSAF : ${esc(G[8]||"")}<br>N° de SIRET : ${esc(siret)}<br>APE : ${esc(G[9]||"")}</b></div></div>
<div class="gb cl"><div class="mr">Et</div><div style="margin-top:6px"><b>${esc(C[0])}</b><br>${esc(C[1])}</div><div style="margin-top:10px"><b>Envoyée à</b> &nbsp; 1. Facture / MAIL<br><span style="margin-left:74px">${esc(C[2])}</span></div></div></div>
<div class="art"><span class="pill">Article 1er : Objet de la Convention</span><span class="mr2">L’organisme ${esc(org)} organisera l’action de formation suivante :</span></div>
${row("Intitulé du stage :",`<b>${esc(D.f)}</b>`)}${row("Objectif :",esc(D.o||"Utilisation et maîtrise d’applications informatiques de gestion"))}${row("Type d’action de formation :","Acquisition des connaissances")}${row("Période du stage :",`<b>DU ${frd(D.a)} AU ${frd(D.b)}</b>`)}${row("Durée en heures :",`<b class="mr">${eur(h)} heures</b>`)}${row("Lieu :",`<span class="gb" style="display:block;padding:3px 10px"><b>${esc(C[0])} &nbsp;&nbsp; ${esc(C[1])}</b></span>`)}
<div class="art"><span class="pill">Article 2 : Effectif formé</span><b>Nombre de stagiaires : ${tr.length}</b></div>
<div class="r"><b>Nom et prénom des stagiaires :</b><span class="trg">${tr.map((t,i)=>`<span>${nmT(i)}</span>`).join("")}</span></div>
<div class="art"><span class="pill">Article 3 : Dispositions Financières</span><span class="mr2">En contrepartie de cette action de formation, l’employeur s’acquittera des coûts suivants :</span></div>
<table class="px"><colgroup><col style="width:34%"><col style="width:22%"><col style="width:22%"><col style="width:22%"></colgroup>
<tr class="hd"><td></td><td>Par jour</td><td>Nbre de jours</td><td>Coût total</td></tr>
<tr><td class="lb">Coûts pédagogiques HT :</td><td>${eur(pj)} €</td><td>${fjn(nbj)}</td><td><b>${eur(tot)} €</b></td></tr>
<tr><td class="lb">Taux horaire HT :</td><td>${eur(pj/hj)} €</td><td></td><td></td></tr></table>
<table class="tt"><tr><td class="sl">Soit Coût Total</td><td class="am"><table><tr><td>Total H.T.</td><td class="v">${eur(tot)} €</td></tr><tr><td>TVA 20 %</td><td class="v">${eur(tva)} €</td></tr><tr class="tc"><td>Total TTC</td><td class="v">${eur(tot+tva)} €</td></tr></table></td></tr></table>
<div style="text-align:center;margin:14px 0 10px">Fait en double exemplaire à MOIRANS &nbsp;le ${esc(dcf)}</div>
<div class="sg"><div><b class="mr">Cachet &amp; Signature de l’Organisme</b><br><img src="stamp.jpg" alt="Cachet TOPAS"></div><div id="sigent"><b class="mr">Cachet &amp; Signature de l’Entreprise</b>${sigBlock()}</div></div>
<div class="ft"><span>S.A.S au capital de ${esc(G[11]||"")}</span><span>APE ${esc(G[9]||"")}</span><span>TVA INTRA : ${esc(G[10]||"")}</span><span>N° Siret : ${esc((siret||"").replace(/\s/g,""))}</span></div></div>`;
}
function hrsT(d){const p=(D.hf||{})[d];return p==="m"?"½ journée : 9h00 – 12h30":p==="a"?"½ journée : 14h00 – 17h30":"9h00 – 12h30 / 14h00 – 17h30"}
function docPlan(){
 const ds=D.ds||[],pe=D.pe||"",ad=D.ad||mail;
 return `<div class="cv pln"><div class="hg2">
<div class="lg"><img src="logo.jpg" alt="TOPAS informatique"><div class="ad">${esc(addr)}<br>Tél ${esc(tel)}<br>Mail ${esc(mail)}<br><b class="web">${esc(web)}</b></div></div>
<div><div class="ttp"><b>Planification</b><span>Envoyée le &nbsp; <b style="font-size:13px;color:#111">${esc(pe?fdl(pe):"")}</b></span></div><div style="margin-top:8px">N° dossier : <b>${esc(D.n)}</b></div></div></div>
<div class="g2"><div><div class="bar">Lieu Intervention</div><div class="bx"><b>${esc(C[0])}</b><br>${esc(C[1])}</div></div>
<div><div style="font-size:15px;margin-bottom:6px">Adresse de Facturation</div><div class="bx"><b>${esc(C[0])}</b><br>${esc(C[1])}<div style="font-size:11px;margin-top:8px"><b>A l’attention de :</b> ${esc(D.at||"1. Facture / MAIL")}<br>${esc(D.em||C[2]||"")}</div></div></div></div>
<div class="msg"><b>Bonjour,</b><br><br><b>Vous trouverez ci-dessous les dates d’intervention en vos locaux.</b><br><br><b>Selon Devis accepté</b>${D.fu?` / <span class="rd">${esc(D.fu)}</span>`:""}<br><b>En vous remerciant par avance de votre acceptation par mail à : <span class="web">${esc(ad)}</span></b></div>
<div class="rw"><div><div class="bar" style="color:#111;font-weight:600">Prestation à Réaliser</div><div class="box"><i>${esc(D.f)}</i><br><br><b>Durée :</b> ${esc(D.h||"")} h · ${fjn(D.j||ds.length||1)} jour(s)<br><b>Période :</b> ${esc(fd(D.a))} → ${esc(fd(D.b))}<br><br><b>Stagiaires (${tr.length}) :</b><br>${tr.map((t,i)=>nmT(i)).join("<br>")||"—"}</div></div>
<div><div class="bar">Dates Intervention</div><div class="box"><div style="font-size:11px;margin-bottom:6px"><b>Intervenant :</b> &nbsp; ${esc(D.iv||"")}</div>${ds.map(d=>`<div class="dtp"><b>${esc(fdl(d))}</b><br><span style="font-size:12px">${hrsT(d)}</span></div>`).join("")||"<i>Dates à définir</i>"}</div></div></div>
<div id="sigent" style="margin-top:14px">${done&&done.sg?`<b class="mr">Validé en ligne</b>${sigBlock()}`:""}</div>
<div class="ftp">*** Ce document vaut pour convocation aux Participants/Stagiaires concernés ***</div>${dero()}</div>`;
}
function dero(){const R=Array.isArray(D.dr)?D.dr:[];if(!R.length)return"";return `<div class="pdx"><div class="bar">Déroulé de l’intervention</div><div style="font-size:12px;margin:0 0 8px">Horaires indicatifs, adaptés sur place au rythme des stagiaires.</div>${R.map(d=>!(d[1]||[]).length?`<div style="border:2px solid #d97706;background:#fff7ed;color:#7c2d12;border-radius:6px;padding:8px 12px;margin:0 0 8px;font-weight:700">${esc(d[0])}</div>`:`<div class="pdj"><div class="pdh">${esc(d[0])}</div>${(d[1]||[]).map(b=>`<div class="pdb"><div class="pdt">${esc(b[0])}</div>${(b[1]||[]).map(g=>(g[0]?`<div class="pdm">${esc(g[0])}</div>`:"")+((g[1]||[]).length?`<ul>${g[1].map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"")).join("")}</div>`).join("")}</div>`).join("")}</div>`}
function head(){return `<img src="logo.jpg" alt="TOPAS informatique" style="height:56px;margin-bottom:8px"><h1>${plan?"Validation de la planification":"Signature de la convention"}</h1><div class="mu">Vérifiez le document ci-dessous, puis signez en bas de page.</div>`}

function render(){
 app.innerHTML=head()+
 `<div class="paper" id="doc">${plan?docPlan():docConv()}</div>`+
 (done?`<div class="card okb noprint"><div class="okt">✔ Déjà ${plan?"validée":"signée"}</div><p>Ce document a déjà été ${plan?"validé":"signé"} depuis cet appareil par <b>${esc(done.nm)}</b> le ${esc(done.tsl)}.</p><button class="sec" id="prt">🖨 Imprimer / enregistrer ma copie</button></div>`:
 `<div class="card noprint" id="form">
  <h2>${plan?"Valider les dates":"Signer la convention"}</h2>
  <p class="mu">Vérifiez le document ci-dessus, puis renseignez les champs. Cela ne prend qu’une minute.</p>
  <label for="nm">Nom et prénom du signataire</label><input type="text" id="nm" autocomplete="name">
  <label for="fn">Fonction</label><input type="text" id="fn" autocomplete="organization-title">
  <label id="sl">Votre signature (au doigt ou à la souris)</label>
  <div class="pad"><canvas id="cv" tabindex="0" aria-labelledby="sl"></canvas><div class="ph" id="ph">Signez ici</div></div>
  <div style="margin-top:6px"><button class="sec" id="clr" type="button">Effacer la signature</button></div>
  <label class="chk"><input type="checkbox" id="ok"><span>${plan?"J’ai pris connaissance des dates d’intervention et je les valide.":"Lu et approuvé, bon pour accord."}</span></label>
  <div class="err" id="err" role="alert"></div>
  <button class="go" id="go" type="button">${plan?"Valider la planification":"Signer la convention"}</button>
  <p class="mu">Les informations saisies sont transmises uniquement à ${esc(org)}. Cette signature électronique simple a valeur d’accord.</p>
 </div>`)+`<div id="res"></div>`;
 if(done){const p=$("#prt");if(p)p.onclick=()=>window.print();return}
 pad();
}
function sigSvg(sg){let d="";String(sg||"").split(";").forEach(st=>{const P=st.split(",").map(q=>q.split(".").map(v=>parseInt(v,36))).filter(q=>q.length===2&&!isNaN(q[0])&&!isNaN(q[1]));if(!P.length)return;if(P.length===1)P.push([P[0][0]+1,P[0][1]]);d+="M"+P.map(q=>q[0]+" "+q[1]).join("L")});return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" width="200" height="87"><path d="${d}" fill="none" stroke="#12308f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function sigDoc(p){return `<div style="margin-top:16px;border:1px solid var(--br);border-radius:8px;padding:10px 14px"><b>${plan?"Validée":"Signée"} en ligne</b> par ${esc(p.nm)}${p.fn?" ("+esc(p.fn)+")":""}, ${esc(C[0])}, le ${esc(p.tsl)}<br><span style="background:#fff;display:inline-block;border-radius:6px">${sigSvg(p.sg)}</span></div>`}

let strokes=[],cur=null;
function pad(){
 const cv=$("#cv"),ctx=cv.getContext("2d");
 function size(){const r=cv.getBoundingClientRect(),dp=window.devicePixelRatio||1;cv.width=Math.max(1,Math.round(r.width*dp));cv.height=Math.max(1,Math.round(r.height*dp));redraw()}
 function pt(e){const r=cv.getBoundingClientRect();return[Math.round((e.clientX-r.left)/r.width*320),Math.round((e.clientY-r.top)/r.height*140)]}
 function redraw(){ctx.clearRect(0,0,cv.width,cv.height);ctx.strokeStyle="#12308f";ctx.lineWidth=2.4*cv.width/320;ctx.lineCap="round";ctx.lineJoin="round";const k=cv.width/320;strokes.concat(cur?[cur]:[]).forEach(s=>{if(!s.length)return;ctx.beginPath();ctx.moveTo(s[0][0]*k,s[0][1]*k);if(s.length===1)ctx.lineTo(s[0][0]*k+.1,s[0][1]*k);s.forEach(q=>ctx.lineTo(q[0]*k,q[1]*k));ctx.stroke()});$("#ph").style.display=(strokes.length||cur)?"none":"flex"}
 cv.addEventListener("pointerdown",e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}cur=[pt(e)];redraw()});
 cv.addEventListener("pointermove",e=>{if(!cur)return;e.preventDefault();cur.push(pt(e));redraw()});
 const end=e=>{if(!cur)return;strokes.push(cur);cur=null;redraw()};
 cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);cv.addEventListener("pointerleave",end);
 $("#clr").onclick=()=>{strokes=[];cur=null;redraw()};
 window.addEventListener("resize",size);size();
 $("#go").onclick=submit;
}
function compact(){
 let th=2,out;
 for(;;){
  out=strokes.map(s=>{const r=[];let l=null;s.forEach((q,i)=>{if(!l||Math.hypot(q[0]-l[0],q[1]-l[1])>=th||i===s.length-1){if(!l||q[0]!==l[0]||q[1]!==l[1])r.push(q);l=q}});return r});
  const n=out.reduce((a,s)=>a+s.length,0),str=out.map(s=>s.map(q=>Math.max(0,q[0]).toString(36)+"."+Math.max(0,q[1]).toString(36)).join(",")).join(";");
  if(str.length<=2200||th>40)return str;th+=1.5;
 }
}
async function submit(){
 const err=$("#err"),nm=$("#nm").value.trim(),fn=$("#fn").value.trim();err.textContent="";
 if(nm.length<3)return(err.textContent="Merci d’indiquer votre nom et prénom.",$("#nm").focus());
 if(!strokes.length)return err.textContent="Merci de signer dans le cadre.";
 if(!$("#ok").checked)return err.textContent="Merci de cocher la case pour confirmer.";
 const go=$("#go");go.disabled=true;go.textContent="Envoi en cours…";
 const now=new Date(),p2=n=>String(n).padStart(2,"0"),dl=now.getFullYear()+"-"+p2(now.getMonth()+1)+"-"+p2(now.getDate()),hl=p2(now.getHours())+":"+p2(now.getMinutes());
 const payload={t:"fp-sign",k:plan?"plan":"conv",n:D.n,nm,fn,dl,hl,tsl:fd(dl)+" à "+hl,sg:compact()};
 const code="FPSIG:"+b64u(payload),body=JSON.stringify(payload);
 const sends=[];
 if(D.t)sends.push(sbDep(D.t,payload));
 if(D.m){const f=new URLSearchParams({_subject:(plan?"Planification validée":"Convention signée")+" – "+D.n+" – "+nm,_captcha:"false",_template:"table",Document:(plan?"Planification ":"Convention ")+D.n,Signataire:nm,Fonction:fn,"Société":C[0],Date:payload.tsl,Code:code});sends.push(fetch("https://formsubmit.co/ajax/"+encodeURIComponent(D.m),{method:"POST",headers:{Accept:"application/json"},body:f}).then(r=>{if(!r.ok)throw 0;return 1}))}
 const R=await Promise.allSettled(sends),ok=R.some(r=>r.status==="fulfilled");
 done={nm,fn,tsl:payload.tsl,sg:payload.sg};
 if(ok){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}
 $("#form").classList.add("hide");$("#doc").innerHTML=plan?docPlan():docConv();
 const mailto="mailto:"+encodeURIComponent(D.m||"")+"?subject="+encodeURIComponent((plan?"Planification validée":"Convention signée")+" – "+D.n+" – "+nm)+"&body="+encodeURIComponent("Bonjour,\n\n"+nm+(fn?" ("+fn+")":"")+" a "+(plan?"validé la planification":"signé la convention")+" "+D.n+" en ligne.\n\n"+code+"\n");
 $("#res").innerHTML=ok?
  `<div class="card okb noprint"><div class="okt">✔ Merci, c’est ${plan?"validé":"signé"} !</div><p>${esc(org)} a bien reçu votre ${plan?"validation":"signature"}. Vous pouvez fermer cette page.</p><button class="sec" id="prt">🖨 Imprimer / enregistrer ma copie</button> <a class="sec btn" href="${mailto}" style="margin-top:6px">✉ Envoyer aussi une confirmation par e-mail</a></div>`:
  `<div class="card noprint" style="border-color:var(--ko)"><div class="err">La transmission automatique n’a pas fonctionné.</div><p>Appuyez sur le bouton ci-dessous pour envoyer votre ${plan?"validation":"signature"} par e-mail (un message est déjà prêt, il suffit de l’envoyer).</p><a class="btn go" href="${mailto}">✉ Envoyer par e-mail</a></div>`;
 const pr=$("#prt");if(pr)pr.onclick=()=>window.print();
 window.scrollTo(0,0);
}
render();
})();
</script>
