<style>
/* 30/10 : TOUJOURS en clair, quel que soit le réglage du téléphone (plus de mode sombre automatique) */
html{color-scheme:light only;background-color:var(--bg)}

:root{--bg:#eef3fa;--card:#fff;--tx:#1f2937;--mu:#5a6275;--br:#d6dfeb;--pr:#1e3a8a;--bl:#1565c0;--gr:#15803d;--grd:#15803d;--sf:#f1f6fc;--ok:#157347;--ko:#b42318;--sel:#e8f6ed;--sh:0 4px 18px rgba(15,23,42,.08)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
.w{max-width:640px;margin:0 auto;padding:16px 12px 32px}
.sh{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--sh)}
.top{background:var(--bl);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px}
.top img{height:40px;background:#fff;border-radius:8px;padding:3px 6px}
.top .tt{flex:1;min-width:0;font-weight:700;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.top .ql{font-size:12px;font-weight:700;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;white-space:nowrap}
.pg{padding:12px 20px 0}
.pgt{display:flex;justify-content:space-between;font-size:15px;color:var(--mu);font-weight:600}
.pgb{height:8px;background:var(--sf);border-radius:99px;overflow:hidden;margin-top:6px}
.pgb i{display:block;height:100%;background:var(--gr);border-radius:99px;transition:width .35s ease}
.bd{padding:18px 20px 22px}
.kk{font-size:14px;font-weight:800;color:var(--gr);text-transform:uppercase;letter-spacing:.6px}
h1{font-size:25px;line-height:1.25;margin:6px 0 4px;color:var(--pr)}
.hi{font-size:21px;font-weight:700;margin:4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sf);border-radius:999px;padding:6px 12px;font-size:15px}
.intro{background:var(--sf);border-radius:14px;padding:14px 16px;margin:12px 0;font-size:16px}
.qb{margin:6px 0 22px}
.qb:last-of-type{margin-bottom:8px}
.ql2{display:block;font-size:19px;font-weight:700;line-height:1.35;margin:0 0 12px}
.req{color:var(--ko);margin-left:2px}
.opt{font-size:14px;color:var(--mu);font-weight:400}
.qerr{color:var(--ko);font-weight:600;font-size:16px;margin-top:8px;min-height:0}
.qb.bad .cards .cd,.qb.bad .yn label,.qb.bad .sm label,.qb.bad input[type=text],.qb.bad textarea{border-color:var(--ko)}
/* cartes de choix */
.cards{display:grid;gap:10px}
.cd,.yn label,.sm label,.st label{position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cards input,.yn input,.sm input,.st input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.cd{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;border:2px solid var(--br);border-radius:14px;background:var(--card);font-size:17px;transition:border-color .15s,background .15s}
.cd .ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--br);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px}
.cd:has(input:checked){border-color:var(--gr);background:var(--sel)}
.cd:has(input:checked) .ck{background:var(--gr);border-color:var(--gr)}
.cd:has(input:checked) .ck::after{content:"✓"}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yn label{display:flex;align-items:center;justify-content:center;gap:8px;min-height:64px;border:2px solid var(--br);border-radius:16px;background:var(--card);font-size:19px;font-weight:700}
.yn label:has(input:checked){border-color:var(--gr);background:var(--gr);color:#fff}
.sm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sm label{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:2px solid var(--br);border-radius:14px;background:var(--card);text-align:center;font-size:13.5px;line-height:1.2;min-height:96px}
.sm .e{font-size:36px;line-height:1.1;transition:transform .18s ease}
.sm label:has(input:checked){border-color:var(--gr);background:var(--sel);font-weight:700}
.sm label:has(input:checked) .e{transform:scale(1.22)}
.st{display:flex;gap:6px;justify-content:space-between;max-width:420px}
.st label{flex:1;display:flex;flex-direction:column;align-items:center;min-height:64px;justify-content:center;border-radius:14px;font-size:14px;color:var(--mu)}
.st .s{font-size:40px;line-height:1;color:#cbd5e1;transition:transform .18s ease,color .15s}
.st label.on .s{color:#b45309}
.st label:has(input:checked) .s{transform:scale(1.18)}
.lg{display:flex;justify-content:space-between;font-size:14px;color:var(--mu);margin-top:6px;max-width:420px}
input[type=text],textarea{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:2px solid var(--br);border-radius:12px;background:var(--card);color:var(--tx)}
textarea{min-height:96px;resize:none;overflow:hidden}
::placeholder{color:#8a93a6}
.cd:focus-within,.yn label:focus-within,.sm label:focus-within,.st label:focus-within{outline:3px solid var(--bl);outline-offset:2px}
input[type=text]:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
@media (hover:hover){.cd:hover,.yn label:hover,.sm label:hover{border-color:var(--bl)}.st label:hover .s{transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* boutons */
.nav{display:flex;gap:10px;margin-top:18px}
button,a.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px 20px;min-height:52px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:17px}
.go{background:var(--gr);color:#fff;flex:1}
.go:hover{background:var(--grd)}
.go[disabled]{opacity:.6;cursor:wait}
.sec{background:var(--sf);color:var(--tx);border:2px solid var(--br)}
.lnk{background:none;color:var(--bl);text-decoration:underline;padding:8px 6px;min-height:44px;font-weight:600}
.big{width:100%;font-size:19px;min-height:58px}
/* récapitulatif */
.rc{border-top:1px solid var(--br)}
.rr{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--br)}
.rr>div{flex:1;min-width:0}
.rr .q{font-size:15px;color:var(--mu)}
.rr .a{font-size:17px;font-weight:600;overflow-wrap:anywhere;white-space:pre-line}
.rr .a.v{color:var(--mu);font-weight:400}
.rr button{flex:none;padding:8px 12px;min-height:44px;font-size:15px}
/* merci */
.thx{text-align:center;padding:28px 18px 10px}
.thx .ckb{width:96px;height:96px;border-radius:50%;background:var(--gr);color:#fff;font-size:54px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.thx h1{font-size:30px}
.thx p{font-size:17px;margin:8px 0}
.links{display:grid;gap:10px;margin:18px 0 0}
.links a{background:var(--sf);color:var(--pr);border:2px solid var(--br)}
.err{color:var(--ko);font-weight:600}
.ft{text-align:center;font-size:14px;color:var(--mu);padding:16px 12px 0}
.hide{display:none!important}
@media (max-width:480px){.w{padding:10px 8px 24px}.bd{padding:16px 16px 20px}h1{font-size:23px}.sm .e{font-size:32px}.sm label{font-size:14px;min-height:90px;padding:8px 2px}.st .s{font-size:36px}.ql2{font-size:18px}}
.pvb{background:#fff4e8;color:#c2410c;border-bottom:1px solid #fed7aa;font-weight:800;text-align:center;padding:10px 12px;font-size:16px}.go:disabled{opacity:.5;cursor:not-allowed}
</style>
